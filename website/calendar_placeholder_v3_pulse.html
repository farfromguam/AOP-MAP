<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calendar Placeholder — V3 Pulse</title>
  <style>
    :root {
      --brown-ink: #2e2418;
      --brown-mid: #4e4128;
      --brown-dark: #2a1f12;
      --brown-soft: #5a4828;
      --cream-hover: #efe2c6;
      --cream-surface: rgba(250, 246, 235, 0.96);
      --cream-border: #d8cdb4;
      --control-bg: #fffdf5;
      --control-border: #b9aa88;
      --moss: #5f7157;
      --moss-dark: #384833;
      --moss-soft: #e3ebdc;
      --rust: #a85020;
    }
    body {
      margin: 0; padding: 24px; font-family: Inter, system-ui, sans-serif;
      background: #d8ccb6;
    }
    .demo-label {
      font: 700 0.72rem Inter, system-ui, sans-serif;
      text-transform: uppercase; letter-spacing: 0.06em;
      color: var(--brown-mid); margin-bottom: 10px;
    }
    /* ── Calendar card chrome ── */
    .calendar-card {
      display: block; padding: 0; overflow: hidden;
      border: 1px solid rgba(155,132,92,0.34); border-radius: 8px;
      background: var(--cream-surface); box-shadow: 0 8px 28px rgba(0,0,0,0.18);
      width: 296px;
    }
    .calendar-toggle {
      width: 100%; display: grid; grid-template-columns: minmax(0,1fr) auto;
      align-items: center; gap: 8px; margin: 0; padding: 8px 10px;
      border: 0; background: transparent; color: var(--brown-ink);
      cursor: pointer; text-align: left; box-sizing: border-box;
    }
    .calendar-title {
      display: block; font: 800 0.78rem Inter, system-ui, sans-serif;
      text-transform: uppercase;
    }
    .calendar-range { display: block; margin-top: 1px; font-size: 0.76rem; color: var(--brown-soft); }
    .calendar-chevron { color: var(--brown-mid); font-size: 1.15rem; line-height: 1; }
    .calendar-body { padding: 0 8px 8px; }
    .calendar-days { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
    .calendar-days li { margin: 0; padding: 0; border-top: 1px solid var(--cream-border); }

    /* ── Pulsing cream gradient rows ── */
    @keyframes pulse-cream {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.55; }
    }
    .pulse-row {
      display: grid;
      grid-template-columns: 44px minmax(0,1fr);
      align-items: start;
      gap: 8px;
      padding: 7px 8px;
      animation: pulse-cream 2s ease-in-out infinite;
    }
    /* Stagger so rows pulse at slightly different phases */
    .pulse-row:nth-child(2) { animation-delay: 0.3s; }
    .pulse-row:nth-child(3) { animation-delay: 0.6s; }

    .pulse-day-col {
      display: grid; gap: 4px; padding-top: 2px;
    }
    .pulse-bar {
      border-radius: 4px;
      background: linear-gradient(135deg, #e8dcc8 0%, #f5efde 60%, #ddd0b5 100%);
    }
    .pulse-day-abbr { height: 9px;  width: 28px; }
    .pulse-day-num  { height: 9px;  width: 18px; }

    .pulse-content-col { display: grid; gap: 6px; padding-top: 2px; }
    .pulse-title    { height: 11px; width: 72%; }
    .pulse-meta     { height: 9px;  width: 44%; }
    .pulse-location { height: 9px;  width: 56%; }
  </style>
</head>
<body>
  <div class="demo-label">V3 — Softly pulsing cream-gradient rows</div>
  <div class="calendar-card">
    <button class="calendar-toggle" type="button">
      <span>
        <span class="calendar-title">Rock Warblers Trail Blazing Invitational</span>
        <span class="calendar-range">Friday, June 19, 2026</span>
      </span>
      <span class="calendar-chevron">▾</span>
    </button>
    <div class="calendar-body">
      <ol class="calendar-days">
        <li>
          <div class="pulse-row">
            <div class="pulse-day-col">
              <div class="pulse-bar pulse-day-abbr"></div>
              <div class="pulse-bar pulse-day-num"></div>
            </div>
            <div class="pulse-content-col">
              <div class="pulse-bar pulse-title"></div>
              <div class="pulse-bar pulse-meta"></div>
              <div class="pulse-bar pulse-location"></div>
            </div>
          </div>
        </li>
        <li>
          <div class="pulse-row">
            <div class="pulse-day-col">
              <div class="pulse-bar pulse-day-abbr"></div>
              <div class="pulse-bar pulse-day-num"></div>
            </div>
            <div class="pulse-content-col">
              <div class="pulse-bar pulse-title" style="width:58%"></div>
              <div class="pulse-bar pulse-meta" style="width:36%"></div>
            </div>
          </div>
        </li>
        <li>
          <div class="pulse-row">
            <div class="pulse-day-col">
              <div class="pulse-bar pulse-day-abbr"></div>
              <div class="pulse-bar pulse-day-num"></div>
            </div>
            <div class="pulse-content-col">
              <div class="pulse-bar pulse-title" style="width:82%"></div>
              <div class="pulse-bar pulse-meta" style="width:48%"></div>
              <div class="pulse-bar pulse-location" style="width:42%"></div>
            </div>
          </div>
        </li>
      </ol>
    </div>
  </div>
</body>
</html>
