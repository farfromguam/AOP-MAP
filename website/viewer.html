<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Trail Blazing Invitational — Map</title>
  <!-- AOP viewer core — Sprint 13, slice 1 (viewer extraction). A clean read
       scaffold built ALONGSIDE index.html; the live page is the reference and is
       never touched. Card: brain/tasks/13_viewer_extraction/viewer_core_scaffold.md
       Slice 1 carries only the map + the pill-bar (zoom / preset / 3D). The
       left-rail drawer (Search / Hot / Calendar), Locate, Install, and version
       come in later slices. NOT yet precached in sw.js — no #appVersion bump owed. -->
  <meta name="theme-color" content="#a85020" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Trail Blazing" />
  <link href="./vendor/maplibre-gl.css" rel="stylesheet" />
  <link href="./css/viewer.css" rel="stylesheet" />
</head>
<body>
  <div id="map"></div>
  <div class="left-controls">
    <!-- Pill bar — ported verbatim from index.html:53-83: zoom presets
         (region / park / pavilion), layer presets (park / topo / trace /
         satellite), and the 3D button + its hidden state checkbox. -->
    <div class="pill-bar" role="group" aria-label="Map view controls">
      <div class="pill zoom-bar" role="group" aria-label="Zoom to area">
        <button id="zoomRegion" type="button" data-view="region" title="Zoom out to the full 9-patch region" aria-label="Region zoom">
          <svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8V3h5M14 3h5v5M19 14v5h-5M8 19H3v-5"/></svg>
        </button>
        <button id="zoomPark" type="button" data-view="park" title="Fit the AOP park boundary" aria-label="Fit park boundary">
          <svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7L7 3L15 4L18 9L17 16L9 18L4 14Z"/><circle cx="11" cy="11" r="1.4" fill="currentColor" stroke="none"/></svg>
        </button>
        <button id="zoomPavilion" type="button" data-view="pavilion" title="Zoom in tight on the pavilion" aria-label="Pavilion zoom">
          <svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9L11 3L19 9"/><path d="M5 9V18M9 9V18M13 9V18M17 9V18"/><path d="M3 18H19"/></svg>
        </button>
      </div>
      <div class="pill preset-bar" role="group" aria-label="Map preset">
        <button id="presetPark" type="button" data-preset="park" class="active" title="Park preset (default map)" aria-label="Park preset">
          <svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6L8 4L14 6L19 4V16L14 18L8 16L3 18Z"/><path d="M8 4V16M14 6V18"/></svg>
        </button>
        <button id="presetTopo" type="button" data-preset="topo" title="Topo preset (contour-led)" aria-label="Topo preset">
          <svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7c3-2 6-2 9 0s5 2 7 0M3 11c3-2 6-2 9 0s5 2 7 0M3 15c3-2 6-2 9 0s5 2 7 0"/></svg>
        </button>
        <button id="presetTrace" type="button" data-preset="trace" title="Trace preset (lidar hillshade + trail refs)" aria-label="Trace preset">
          <svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="16" height="16" rx="2"/><path d="M5 16c2-1 3-4 6-4s4 3 6 2"/><circle cx="6" cy="16" r="1.4" fill="currentColor" stroke="none"/><circle cx="17" cy="14" r="1.4" fill="currentColor" stroke="none"/></svg>
        </button>
        <button id="presetSatellite" type="button" data-preset="satellite" title="Satellite preset (aerial)" aria-label="Satellite preset">
          <svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 3 L16.5 11 H13.5 L17.5 17.5 H4.5 L8.5 11 H5.5 Z"/><path d="M11 17.5 V20"/></svg>
        </button>
      </div>
      <div class="pill" role="group" aria-label="3D toggle">
        <button id="terrainButton" type="button" class="terrain-button" aria-pressed="false" title="Toggle 3D terrain view">3D</button>
      </div>
      <input type="checkbox" id="showTerrain" hidden />
    </div>
    <!-- Left-rail drawer — slice 3 (from index.html:84-197). Two columns: an
         icon column of tabs and a content column of stacked panels. Search
         (slice 2) now lives in the first panel. The Hot tab (slice 5), the POI
         sub-tab (slice 4), and the per-card resize handles are deferred. -->
    <div class="lr-drawer" id="lrDrawer">
      <div class="lr-icon-col" id="lrIconCol">
        <button class="lr-tab open" id="lrTabSearch" type="button" aria-pressed="true" aria-controls="lrPanelSearch" title="Search">
          <svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="9.5" cy="9.5" r="6"/>
            <path d="M14.2 14.2 L19 19"/>
          </svg>
        </button>
        <button class="lr-tab open" id="lrTabCal" type="button" aria-pressed="true" aria-controls="lrPanelCal" title="Events / About">
          <svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="4" y="5" width="14" height="15" rx="1.6"/>
            <path d="M8.5 5 V 3.5 Q8.5 3 9 3 h4 Q13.5 3 13.5 3.5 V 5"/>
            <path d="M7 9.5 H 15"/>
            <path d="M7 12.5 H 15"/>
            <path d="M7 15.5 H 12"/>
          </svg>
        </button>
      </div>
      <div class="lr-content-col" id="lrContentCol">
        <div class="lr-panel open" id="lrPanelSearch" data-card="search">
          <div class="search-shell">
            <div class="search">
              <svg class="search-icon" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="9.5" cy="9.5" r="6"/>
                <path d="M14.2 14.2 L19 19"/>
              </svg>
              <input type="text" id="searchInput" placeholder="Search the map…" autocomplete="off" />
              <div class="search-results" id="searchResults"></div>
            </div>
          </div>
        </div>
        <div class="lr-panel open" id="lrPanelCal" data-card="cal">
          <section class="calendar-card" id="calendarCard" aria-label="Events and park information">
            <div class="left-tabs" role="tablist" aria-label="Left panel content">
              <button id="leftTabEvents" class="left-tab" type="button" role="tab" aria-selected="true" aria-controls="eventsTabPanel" data-left-tab="events">Events</button>
              <button id="leftTabAbout" class="left-tab" type="button" role="tab" aria-selected="false" aria-controls="aboutTabPanel" data-left-tab="about" tabindex="-1">About</button>
            </div>
            <div class="left-tab-panels">
              <div id="eventsTabPanel" class="left-tab-panel" role="tabpanel" aria-labelledby="leftTabEvents">
                <div id="calendarBody" class="calendar-body">
                  <div id="calendarToggle" class="calendar-heading" aria-controls="calendarBody">
                    <span>
                      <span class="calendar-title" id="calendarTitle">Rock Warblers Trail Blazing Invitational</span>
                      <span class="calendar-range" id="calendarRange">Friday, June 19, 2026 – Sunday, June 21, 2026</span>
                    </span>
                  </div>
                  <div id="calendarCountdown" class="calendar-countdown" hidden>
                    <span class="calendar-countdown-label">Gates open in</span>
                    <span class="calendar-countdown-value" id="calendarCountdownValue">--</span>
                  </div>
                  <ol class="calendar-days" id="calendarDays">
                    <li class="calendar-empty">Loading schedule...</li>
                  </ol>
                </div>
              </div>
              <div id="aboutTabPanel" class="left-tab-panel" role="tabpanel" aria-labelledby="leftTabAbout" hidden>
                <div class="info-panel" id="aboutInfoPanel">
                  <p class="info-copy">About the Rock Warblers Trail Blazing Invitational at Adventure Off Road Park — loading…</p>
                </div>
              </div>
            </div>
          </section>
        </div>
      </div>
    </div>
  </div>
  <div class="message" id="message">Loading publish layer...</div>

  <script src="./vendor/maplibre-gl.js"></script>
  <!-- The ONE shared event-schedule resolver (window.AOPEventSchedule); loaded
       before viewer_core.js, same as the live page loads it before main.js. -->
  <script src="./js/event_schedule_geojson.js"></script>
  <script src="./js/viewer_core.js"></script>
</body>
</html>
