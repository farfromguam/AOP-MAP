<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Peek — today (no border)</title>
<style>
  :root{ --paper:#e9e0cb; --paper-band:#e6dcc1; --rule:#3a2c1a; --brown-soft:#5a4828; --m:92px; }
  *{box-sizing:border-box;}
  html,body{margin:0; height:100%; overflow:hidden; background:#cdbf9f;
    font-family:Inter,system-ui,sans-serif; color:#2e2418;}
  .viewport{position:fixed; inset:0; overflow:hidden; touch-action:none; cursor:grab; background:var(--paper-band);}
  .viewport.drag{cursor:grabbing;}
  .stage{position:absolute; top:0; left:0; will-change:transform;}
  .stage.snap{transition:transform 0.5s cubic-bezier(.22,1.2,.36,1);}
  /* No decoration — just blank map paper beyond the data, the way it falls off today. */
  .frame{position:absolute; inset:0; background:var(--paper-band);}
  .data{position:absolute; top:var(--m); left:var(--m); width:1200px; height:895px;
    box-shadow:0 0 0 1px rgba(58,44,26,0.12);}
  .void-note{position:absolute; left:0; right:0; bottom:26px; text-align:center;
    font:italic 12px Georgia,serif; color:rgba(90,72,40,0.55); letter-spacing:0.04em;}
  .hint{position:fixed; left:50%; bottom:16px; transform:translateX(-50%); z-index:9;
    background:rgba(42,31,18,0.82); color:#f3e9d2; padding:7px 14px; border-radius:999px;
    font:700 12px Inter,system-ui,sans-serif; pointer-events:none; transition:opacity .4s ease;}
</style>
</head>
<body>
  <div class="viewport" id="vp">
    <div class="stage" id="stage">
      <div class="frame">
        <div class="void-note" style="top:30px;">— layers end here, on bare paper —</div>
      </div>
      <img class="data" src="img/map_sample.png" alt="AOP map" draggable="false">
    </div>
    <div class="hint" id="hint">drag to pan · pull past the edge ↗</div>
  </div>
<script>
(function(){
  var M=92, DW=1200, DH=895, SW=DW+2*M, SH=DH+2*M;
  var vp=document.getElementById('vp'), stage=document.getElementById('stage'), hint=document.getElementById('hint');
  stage.style.width=SW+'px'; stage.style.height=SH+'px';
  var tx=0, ty=0, dragging=false, sx=0, sy=0, bx=0, by=0;
  function limits(){ var vw=vp.clientWidth, vh=vp.clientHeight;
    return { txMax:-M, txMin:vw-M-DW, tyMax:-M, tyMin:vh-M-DH }; }
  function damp(o){ return Math.min(M,Math.abs(o)*0.55)*Math.sign(o); }
  function soft(v,min,max){ if(min>max) return (min+max)/2;
    if(v>max) return max+damp(v-max); if(v<min) return min+damp(v-min); return v; }
  function hard(v,min,max){ if(min>max) return (min+max)/2; return Math.max(min,Math.min(max,v)); }
  function apply(){ stage.style.transform='translate('+tx+'px,'+ty+'px)'; }
  function center(){ var L=limits(); tx=(L.txMin+L.txMax)/2; ty=(L.tyMin+L.tyMax)/2; apply(); }
  vp.addEventListener('pointerdown',function(e){ dragging=true; stage.classList.remove('snap'); vp.classList.add('drag');
    sx=e.clientX; sy=e.clientY; bx=tx; by=ty; vp.setPointerCapture(e.pointerId); if(hint) hint.style.opacity='0'; });
  vp.addEventListener('pointermove',function(e){ if(!dragging) return; var L=limits();
    tx=soft(bx+(e.clientX-sx),L.txMin,L.txMax); ty=soft(by+(e.clientY-sy),L.tyMin,L.tyMax); apply(); });
  function release(){ if(!dragging) return; dragging=false; vp.classList.remove('drag'); var L=limits();
    stage.classList.add('snap'); tx=hard(tx,L.txMin,L.txMax); ty=hard(ty,L.tyMin,L.tyMax); apply(); }
  vp.addEventListener('pointerup',release); vp.addEventListener('pointercancel',release);
  window.addEventListener('resize',center); center();
})();
</script>
</body>
</html>
