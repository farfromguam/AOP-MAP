<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Map border V4 — Edge text ribbon</title>
<style>
  :root{
    --brown-ink:#2e2418; --brown-mid:#4e4128; --brown-dark:#2a1f12; --brown-soft:#5a4828;
    --rust:#a85020; --paper:#e9e0cb; --paper-band:#e3d7bb; --rule:#3a2c1a; --band:40px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0; height:100%; overflow:hidden; background:var(--paper);
    font-family:Inter,system-ui,sans-serif; color:var(--brown-ink);}
  .map{position:fixed; inset:0; background:var(--paper) url('img/map_sample.png') center/contain no-repeat;}
  .map::after{content:""; position:absolute; inset:0;
    background:radial-gradient(120% 120% at 50% 48%, transparent 56%, var(--paper) 92%); opacity:0.85;}

  /* Continuous lettered band, ruled top & bottom, framing the whole plate. */
  .frame{position:fixed; inset:0; pointer-events:none; z-index:5;}
  .frame::before{content:""; position:absolute; inset:0;
    box-shadow: inset 0 0 0 var(--band) var(--paper-band);}
  .keyline{position:absolute; inset:var(--band);
    border:1.5px solid var(--rule); box-shadow: 0 0 0 6px var(--paper-band);}
  .keyline.out{inset:9px; border-width:1px; box-shadow:none;}

  .edge{position:absolute; display:flex; align-items:center; justify-content:center;
    font:800 11px Inter,system-ui,sans-serif; letter-spacing:0.42em; text-transform:uppercase;
    color:var(--brown-dark); white-space:nowrap; overflow:hidden;}
  .edge.sub{font-weight:700; font-size:9px; letter-spacing:0.3em; color:var(--brown-soft);}
  .top{top:0; left:var(--band); right:var(--band); height:var(--band);}
  .bottom{bottom:0; left:var(--band); right:var(--band); height:var(--band);}
  .left{left:0; top:var(--band); bottom:var(--band); width:var(--band);
    writing-mode:vertical-rl; transform:rotate(180deg);}
  .right{right:0; top:var(--band); bottom:var(--band); width:var(--band);
    writing-mode:vertical-rl;}
  /* Little diamond markers at the band corners. */
  .dot{position:absolute; width:7px; height:7px; background:var(--rust);
    transform:rotate(45deg); box-shadow:0 0 0 1px var(--rule);}
  .dot.tl{top:calc(var(--band)/2 - 3.5px); left:calc(var(--band)/2 - 3.5px);}
  .dot.tr{top:calc(var(--band)/2 - 3.5px); right:calc(var(--band)/2 - 3.5px);}
  .dot.bl{bottom:calc(var(--band)/2 - 3.5px); left:calc(var(--band)/2 - 3.5px);}
  .dot.br{bottom:calc(var(--band)/2 - 3.5px); right:calc(var(--band)/2 - 3.5px);}
</style>
</head>
<body>
  <div class="map"></div>
  <div class="frame">
    <div class="edge top">Adventure&nbsp;Off&nbsp;Road&nbsp;Park&nbsp;&nbsp;·&nbsp;&nbsp;Trail&nbsp;Blazing&nbsp;Invitational</div>
    <div class="edge bottom sub">South&nbsp;Pittsburg&nbsp;·&nbsp;Marion&nbsp;County&nbsp;·&nbsp;Tennessee&nbsp;&nbsp;—&nbsp;&nbsp;Scale&nbsp;1:9,000&nbsp;·&nbsp;June&nbsp;2026</div>
    <div class="edge left sub">35°&nbsp;00′&nbsp;North&nbsp;&nbsp;·&nbsp;&nbsp;Established&nbsp;MMXXVI</div>
    <div class="edge right sub">85°&nbsp;36′&nbsp;West&nbsp;&nbsp;·&nbsp;&nbsp;Cumberland&nbsp;Plateau</div>
    <div class="keyline out"></div>
    <div class="keyline"></div>
    <span class="dot tl"></span><span class="dot tr"></span>
    <span class="dot bl"></span><span class="dot br"></span>
  </div>
</body>
</html>
