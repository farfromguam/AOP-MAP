<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AOP Map Viewer</title>
  <link href="./vendor/maplibre-gl.css" rel="stylesheet" />
  <style>
    body, html { margin: 0; padding: 0; height: 100%; font-family: Inter, system-ui, sans-serif; }
    #map { position: absolute; top: 0; bottom: 0; width: 100%; }
    .panel { position: absolute; right: 12px; top: 12px; background: rgba(255,255,255,0.94); padding: 14px; border-radius: 12px; box-shadow: 0 10px 35px rgba(0,0,0,0.15); max-width: 320px; z-index: 2; }
    .panel h1 { margin: 0 0 8px; font-size: 1rem; }
    .panel label { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; font-size: 0.94rem; }
    .panel small { display: block; margin-top: 8px; color: #444; }
    .message { position: absolute; left: 12px; bottom: 12px; background: rgba(255,255,255,0.95); padding: 10px 12px; border-radius: 10px; font-size: 0.9rem; }
  </style>
</head>
<body>
  <div id="map"></div>
  <div class="panel">
    <h1>AOP MVP viewer</h1>
    <label><input type="checkbox" id="showSatellite" /> Satellite imagery (TNMap 2022)</label>
    <label><input type="checkbox" id="showNinePatch" /> 9-patch acquisition AOI</label>
    <label><input type="checkbox" id="showLidarTiles" /> Lidar tile index (USGS 3DEP)</label>
    <label><input type="checkbox" id="showTrails" checked /> Publishable trails</label>
    <label><input type="checkbox" id="showBoundaries" checked /> Publishable boundaries</label>
    <label><input type="checkbox" id="showTrailheads" checked /> Publishable trailheads</label>
    <small>Satellite tiles served by TDOT/TNMap — inspection use only, not for redistribution.</small>
    <small>Place a publishable GeoJSON file at <code>website/data/publish.geojson</code> and reload.</small>
  </div>
  <div class="message" id="message">Loading publish layer...</div>

  <script src="./vendor/maplibre-gl.js"></script>
  <script>
    const map = new maplibregl.Map({
      container: 'map',
      style: {
        version: 8,
        sources: {},
        layers: [
          {
            id: 'background',
            type: 'background',
            paint: { 'background-color': '#e8f0f6' }
          }
        ]
      },
      center: [-85.85, 35.03],
      zoom: 12
    });

    const message = document.getElementById('message');
    const satelliteToggle = document.getElementById('showSatellite');
    const ninePatchToggle = document.getElementById('showNinePatch');
    const lidarTilesToggle = document.getElementById('showLidarTiles');
    const trailToggle = document.getElementById('showTrails');
    const boundaryToggle = document.getElementById('showBoundaries');
    const trailheadToggle = document.getElementById('showTrailheads');

    function setLayerVisibility(layerId, visible) {
      if (map.getLayer(layerId)) {
        map.setLayoutProperty(layerId, 'visibility', visible ? 'visible' : 'none');
      }
    }

    function updateLayerVisibility() {
      setLayerVisibility('tnmap-satellite', satelliteToggle.checked);
      setLayerVisibility('nine-patch-fill', ninePatchToggle.checked);
      setLayerVisibility('nine-patch-outline', ninePatchToggle.checked);
      setLayerVisibility('nine-patch-labels', ninePatchToggle.checked);
      setLayerVisibility('lidar-tiles-fill', lidarTilesToggle.checked);
      setLayerVisibility('lidar-tiles-outline', lidarTilesToggle.checked);
      setLayerVisibility('lidar-tiles-labels', lidarTilesToggle.checked);
      setLayerVisibility('publish-trails', trailToggle.checked);
      setLayerVisibility('publish-boundary-fill', boundaryToggle.checked);
      setLayerVisibility('publish-boundaries', boundaryToggle.checked);
      setLayerVisibility('publish-trailheads', trailheadToggle.checked);
    }

    function escapeHtml(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function detailRows(rows) {
      return rows
        .filter(([, value]) => value !== undefined && value !== null && value !== '')
        .map(([label, value]) => `${escapeHtml(label)}: ${escapeHtml(value)}`)
        .join('<br/>');
    }

    function extendBounds(bounds, coordinates) {
      if (typeof coordinates[0] === 'number') {
        const [lng, lat] = coordinates;
        bounds.minLng = Math.min(bounds.minLng, lng);
        bounds.minLat = Math.min(bounds.minLat, lat);
        bounds.maxLng = Math.max(bounds.maxLng, lng);
        bounds.maxLat = Math.max(bounds.maxLat, lat);
        return;
      }

      coordinates.forEach((child) => extendBounds(bounds, child));
    }

    function fitToDataBounds(data) {
      const bounds = {
        minLng: Infinity,
        minLat: Infinity,
        maxLng: -Infinity,
        maxLat: -Infinity
      };

      data.features
        .filter((feature) => feature.geometry?.coordinates)
        .forEach((feature) => extendBounds(bounds, feature.geometry.coordinates));

      if (Number.isFinite(bounds.minLng)) {
        map.fitBounds(
          [
            [bounds.minLng, bounds.minLat],
            [bounds.maxLng, bounds.maxLat]
          ],
          { padding: 60, duration: 0, maxZoom: 14 }
        );
      }
    }

    map.on('load', async () => {
      map.addSource('tnmap-imagery', {
        type: 'raster',
        tiles: [
          'https://tnmap.tn.gov/arcgis/rest/services/BASEMAPS/IMAGERY_WEB_MERCATOR/MapServer/tile/{z}/{y}/{x}'
        ],
        tileSize: 256,
        minzoom: 11,
        maxzoom: 22,
        bounds: [-85.782935283, 35.067164188, -85.717154097, 35.117928496],
        attribution: 'Imagery: TDOT Aerial Surveys / TNMap'
      });

      map.addLayer({
        id: 'tnmap-satellite',
        type: 'raster',
        source: 'tnmap-imagery',
        layout: { visibility: 'none' },
        paint: { 'raster-opacity': 1 }
      });

      let ninePatchData;
      try {
        const ninePatchResponse = await fetch('./data/aop_9_patch.geojson');
        if (ninePatchResponse.ok) {
          ninePatchData = await ninePatchResponse.json();
        }
      } catch (error) {
        console.warn('9-patch overlay missing:', error);
      }

      if (ninePatchData) {
        map.addSource('nine-patch', { type: 'geojson', data: ninePatchData });
        map.addLayer({
          id: 'nine-patch-fill',
          type: 'fill',
          source: 'nine-patch',
          layout: { visibility: 'none' },
          paint: { 'fill-color': '#ffcc33', 'fill-opacity': 0.06 }
        });
        map.addLayer({
          id: 'nine-patch-outline',
          type: 'line',
          source: 'nine-patch',
          layout: { visibility: 'none' },
          paint: { 'line-color': '#cc8800', 'line-width': 1.5, 'line-dasharray': [2, 2] }
        });
        map.addLayer({
          id: 'nine-patch-labels',
          type: 'symbol',
          source: 'nine-patch',
          layout: {
            visibility: 'none',
            'text-field': ['get', 'cell_code'],
            'text-size': 12,
            'text-anchor': 'center'
          },
          paint: {
            'text-color': '#664400',
            'text-halo-color': '#ffffff',
            'text-halo-width': 1.5
          }
        });
      }

      let lidarTileData;
      try {
        const lidarTileResponse = await fetch('./data/aop_lidar_tiles.geojson');
        if (lidarTileResponse.ok) {
          lidarTileData = await lidarTileResponse.json();
        }
      } catch (error) {
        console.warn('Lidar tile index missing:', error);
      }

      if (lidarTileData) {
        map.addSource('lidar-tiles', { type: 'geojson', data: lidarTileData });
        map.addLayer({
          id: 'lidar-tiles-fill',
          type: 'fill',
          source: 'lidar-tiles',
          layout: { visibility: 'none' },
          paint: { 'fill-color': '#6a5acd', 'fill-opacity': 0.08 }
        });
        map.addLayer({
          id: 'lidar-tiles-outline',
          type: 'line',
          source: 'lidar-tiles',
          layout: { visibility: 'none' },
          paint: { 'line-color': '#4b3f9a', 'line-width': 1.25 }
        });
        map.addLayer({
          id: 'lidar-tiles-labels',
          type: 'symbol',
          source: 'lidar-tiles',
          layout: {
            visibility: 'none',
            'text-field': ['get', 'tile_code'],
            'text-size': 11,
            'text-anchor': 'center'
          },
          paint: {
            'text-color': '#2c2466',
            'text-halo-color': '#ffffff',
            'text-halo-width': 1.5
          }
        });
      }

      let publishData;

      try {
        const response = await fetch('./data/publish.geojson');
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        publishData = await response.json();
      } catch (error) {
        console.error(error);
        message.textContent = 'Publish layer failed to load.';
        return;
      }

      map.addSource('publish-data', {
        type: 'geojson',
        data: publishData
      });

      map.addLayer({
        id: 'publish-boundary-fill',
        type: 'fill',
        source: 'publish-data',
        filter: ['==', ['get', 'layer'], 'park_boundaries'],
        paint: { 'fill-color': '#4d8ac8', 'fill-opacity': 0.16 }
      });

      map.addLayer({
        id: 'publish-boundaries',
        type: 'line',
        source: 'publish-data',
        filter: ['==', ['get', 'layer'], 'park_boundaries'],
        paint: { 'line-color': '#0055aa', 'line-width': 3 }
      });

      map.addLayer({
        id: 'publish-trails',
        type: 'line',
        source: 'publish-data',
        filter: ['==', ['get', 'layer'], 'trail_centerlines'],
        paint: { 'line-color': '#f16624', 'line-width': 4 }
      });

      map.addLayer({
        id: 'publish-trailheads',
        type: 'circle',
        source: 'publish-data',
        filter: ['==', ['get', 'layer'], 'trailheads'],
        paint: { 'circle-radius': 6, 'circle-color': '#009688', 'circle-stroke-color': '#ffffff', 'circle-stroke-width': 2 }
      });

      updateLayerVisibility();
      fitToDataBounds(publishData);

      map.on('click', 'publish-trails', (event) => {
        const props = event.features?.[0]?.properties || {};
        const coordinates = event.lngLat;
        const description = `<strong>Trail</strong><br/>${detailRows([
          ['Name', props.name || 'Unnamed'],
          ['Difficulty', props.difficulty || 'unknown'],
          ['Confidence', props.confidence || 'unknown'],
          ['Status', props.status || 'unknown']
        ])}`;
        new maplibregl.Popup().setLngLat(coordinates).setHTML(description).addTo(map);
      });

      map.on('click', 'publish-boundaries', (event) => {
        const props = event.features?.[0]?.properties || {};
        const coordinates = event.lngLat;
        const description = `<strong>Boundary</strong><br/>${detailRows([
          ['Name', props.name || 'Unnamed'],
          ['Confidence', props.confidence || 'unknown'],
          ['Status', props.status || 'unknown'],
          ['Permission', props.permission || 'unknown']
        ])}`;
        new maplibregl.Popup().setLngLat(coordinates).setHTML(description).addTo(map);
      });

      map.on('click', 'lidar-tiles-fill', (event) => {
        const props = event.features?.[0]?.properties || {};
        const coordinates = event.lngLat;
        const downloadUrl = props.download_url || '';
        const downloadLink = downloadUrl
          ? `<a href="${escapeHtml(downloadUrl)}" target="_blank" rel="noopener">Download LAZ</a>`
          : '';
        const description = `<strong>Lidar tile</strong><br/>${detailRows([
          ['Tile', props.tile_code || 'unknown'],
          ['Project', props.project || 'unknown'],
          ['Published', props.publication_date || 'unknown'],
          ['Size (MB)', props.size_mb ?? 'unknown']
        ])}${downloadLink ? '<br/>' + downloadLink : ''}`;
        new maplibregl.Popup().setLngLat(coordinates).setHTML(description).addTo(map);
      });

      map.on('click', 'publish-trailheads', (event) => {
        const props = event.features?.[0]?.properties || {};
        const coordinates = event.lngLat;
        const description = `<strong>Trailhead</strong><br/>${detailRows([
          ['Name', props.name || 'Unnamed'],
          ['Status', props.status || 'unknown']
        ])}`;
        new maplibregl.Popup().setLngLat(coordinates).setHTML(description).addTo(map);
      });

      map.on('error', (e) => {
        console.error(e.error || e);
      });

      message.textContent = `${publishData.features.length} publish feature${publishData.features.length === 1 ? '' : 's'} loaded.`;
    });

    satelliteToggle.addEventListener('change', updateLayerVisibility);
    ninePatchToggle.addEventListener('change', updateLayerVisibility);
    lidarTilesToggle.addEventListener('change', updateLayerVisibility);
    trailToggle.addEventListener('change', updateLayerVisibility);
    boundaryToggle.addEventListener('change', updateLayerVisibility);
    trailheadToggle.addEventListener('change', updateLayerVisibility);
  </script>
</body>
</html>
