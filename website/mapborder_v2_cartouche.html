<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Map border V2 — Cartouche &amp; compass</title>
<style>
  :root{
    --brown-ink:#2e2418; --brown-mid:#4e4128; --brown-dark:#2a1f12; --brown-soft:#5a4828;
    --rust:#a85020; --moss-dark:#384833;
    --paper:#e9e0cb; --paper-card:#f4ecd8; --rule:#3a2c1a; --band:16px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0; height:100%; overflow:hidden; background:var(--paper);
    font-family:Inter,system-ui,sans-serif; color:var(--brown-ink);}
  .map{position:fixed; inset:0; background:var(--paper) url('img/map_sample.png') center/contain no-repeat;}
  .map::after{content:""; position:absolute; inset:0;
    background:radial-gradient(120% 120% at 50% 48%, transparent 54%, var(--paper) 90%); opacity:0.9;}

  .frame{position:fixed; inset:0; pointer-events:none; z-index:5;
    box-shadow: inset 0 0 0 var(--band) var(--paper);}
  .keyline{position:absolute; inset:11px; border:1.5px solid var(--rule);
    box-shadow: inset 0 0 0 2px var(--paper), inset 0 0 0 3px rgba(58,44,26,0.4);}

  /* Title cartouche, top-left scroll banner. */
  .cartouche{position:absolute; top:24px; left:26px; width:228px;
    background:var(--paper-card); border:1.5px solid var(--rule); border-radius:3px;
    box-shadow:0 3px 10px rgba(42,31,18,0.28), inset 0 0 0 3px var(--paper-card), inset 0 0 0 4px rgba(58,44,26,0.55);
    padding:11px 16px 12px;}
  .cartouche .eyebrow{font:700 8.5px Inter,system-ui,sans-serif; letter-spacing:0.22em;
    text-transform:uppercase; color:var(--rust);}
  .cartouche .name{margin:3px 0 0; font:800 16px Georgia,'Times New Roman',serif;
    letter-spacing:0.01em; color:var(--brown-dark); line-height:1.05;}
  .cartouche .sub{margin-top:4px; font:italic 10.5px Georgia,serif; color:var(--brown-soft);}
  .cartouche .flourish{margin-top:7px; height:8px;
    background:radial-gradient(circle at center, var(--rule) 0 1.6px, transparent 1.8px) center/14px 8px no-repeat,
      linear-gradient(var(--rule),var(--rule)) left 49% top 50%/64px 1px no-repeat,
      linear-gradient(var(--rule),var(--rule)) right 49% top 50%/64px 1px no-repeat;}

  /* Compass rose, bottom-right. */
  .compass{position:absolute; right:24px; bottom:24px; width:104px; height:104px;}
  .compass svg{position:absolute; inset:9px; width:86px; height:86px;}
  .compass .lab{position:absolute; font:800 10px Georgia,serif; color:var(--brown-dark);}
  .compass .lab.n{top:-1px; left:50%; transform:translateX(-50%);}
  .compass .lab.s{bottom:-1px; left:50%; transform:translateX(-50%);}
  .compass .lab.e{right:0; top:50%; transform:translateY(-50%);}
  .compass .lab.w{left:0; top:50%; transform:translateY(-50%);}

  /* Scale bar, bottom-left. */
  .scale{position:absolute; left:30px; bottom:30px; font:700 9px Inter,system-ui,sans-serif;
    letter-spacing:0.04em; color:var(--brown-mid); text-align:center;}
  .scale .bar{display:flex; height:8px; width:130px; border:1px solid var(--rule); margin-bottom:4px;}
  .scale .bar i{flex:1; border-right:1px solid var(--rule);}
  .scale .bar i:nth-child(odd){background:var(--rule);}
  .scale .bar i:last-child{border-right:0;}
</style>
</head>
<body>
  <div class="map"></div>
  <div class="frame">
    <div class="keyline"></div>

    <div class="cartouche">
      <div class="eyebrow">Rock Warblers — 2026</div>
      <div class="name">Adventure Off&nbsp;Road Park</div>
      <div class="sub">Trail Blazing Invitational</div>
      <div class="flourish"></div>
    </div>

    <div class="compass">
      <svg viewBox="-50 -50 100 100" fill="none">
        <circle r="46" stroke="#3a2c1a" stroke-width="1.2"/>
        <circle r="40" stroke="#3a2c1a" stroke-width="0.6" stroke-dasharray="2 4"/>
        <!-- minor (diagonal) points -->
        <path d="M0,-30 L6,-6 L0,0 L-6,-6 Z M0,30 L6,6 L0,0 L-6,6 Z M-30,0 L-6,-6 L0,0 L-6,6 Z M30,0 L6,-6 L0,0 L6,6 Z"
              transform="rotate(45)" fill="#cdbf9f" stroke="#3a2c1a" stroke-width="0.6"/>
        <!-- major (cardinal) points -->
        <path d="M0,-42 L7,-7 L0,0 L-7,-7 Z" fill="#a85020" stroke="#3a2c1a" stroke-width="0.7"/>
        <path d="M0,42 L7,7 L0,0 L-7,7 Z" fill="#5a4828" stroke="#3a2c1a" stroke-width="0.7"/>
        <path d="M-42,0 L-7,-7 L0,0 L-7,7 Z" fill="#5a4828" stroke="#3a2c1a" stroke-width="0.7"/>
        <path d="M42,0 L7,-7 L0,0 L7,7 Z" fill="#5a4828" stroke="#3a2c1a" stroke-width="0.7"/>
        <circle r="3" fill="#2a1f12"/>
      </svg>
      <span class="lab n">N</span><span class="lab s">S</span>
      <span class="lab e">E</span><span class="lab w">W</span>
    </div>

    <div class="scale">
      <div class="bar"><i></i><i></i><i></i><i></i></div>
      0&nbsp;&nbsp;&nbsp;&nbsp;&frac14;&nbsp;&nbsp;&nbsp;&nbsp;&frac12;&nbsp;&nbsp;mi
    </div>
  </div>
</body>
</html>
