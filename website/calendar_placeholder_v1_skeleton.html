<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calendar Placeholder — V1 Skeleton</title>
  <style>
    :root {
      --brown-ink: #2e2418;
      --brown-mid: #4e4128;
      --brown-dark: #2a1f12;
      --brown-soft: #5a4828;
      --cream-hover: #efe2c6;
      --cream-surface: rgba(250, 246, 235, 0.96);
      --cream-border: #d8cdb4;
      --control-bg: #fffdf5;
      --control-border: #b9aa88;
      --moss: #5f7157;
      --moss-dark: #384833;
      --moss-soft: #e3ebdc;
      --rust: #a85020;
    }
    body {
      margin: 0; padding: 24px; font-family: Inter, system-ui, sans-serif;
      background: #d8ccb6;
    }
    .demo-label {
      font: 700 0.72rem Inter, system-ui, sans-serif;
      text-transform: uppercase; letter-spacing: 0.06em;
      color: var(--brown-mid); margin-bottom: 10px;
    }
    /* ── Calendar card chrome (copied from index.html) ── */
    .calendar-card {
      display: block; padding: 0; overflow: hidden;
      border: 1px solid rgba(155,132,92,0.34); border-radius: 8px;
      background: var(--cream-surface); box-shadow: 0 8px 28px rgba(0,0,0,0.18);
      width: 296px;
    }
    .calendar-toggle {
      width: 100%; display: grid; grid-template-columns: minmax(0,1fr) auto;
      align-items: center; gap: 8px; margin: 0; padding: 8px 10px;
      border: 0; background: transparent; color: var(--brown-ink);
      cursor: pointer; text-align: left; box-sizing: border-box;
    }
    .calendar-title {
      display: block; font: 800 0.78rem Inter, system-ui, sans-serif;
      text-transform: uppercase;
    }
    .calendar-range { display: block; margin-top: 1px; font-size: 0.76rem; color: var(--brown-soft); }
    .calendar-chevron { color: var(--brown-mid); font-size: 1.15rem; line-height: 1; }
    .calendar-body { padding: 0 8px 8px; }
    .calendar-days { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
    .calendar-days li { margin: 0; padding: 0; border-top: 1px solid var(--cream-border); }

    /* ── Skeleton shimmer ── */
    @keyframes shimmer {
      0%   { background-position: -400px 0; }
      100% { background-position: 400px 0; }
    }
    .skel {
      border-radius: 4px;
      background: linear-gradient(90deg, #e8dcc8 25%, #f5efde 50%, #e8dcc8 75%);
      background-size: 800px 100%;
      animation: shimmer 1.6s ease-in-out infinite;
    }

    /* One skeleton row shaped like a real .calendar-row */
    .skel-row {
      display: grid;
      grid-template-columns: 44px minmax(0,1fr);
      align-items: start;
      gap: 8px;
      padding: 7px 8px;
    }
    .skel-day-col {
      display: grid; gap: 4px; padding-top: 2px;
    }
    .skel-day-abbr { height: 9px; width: 28px; }
    .skel-day-num  { height: 9px; width: 18px; }
    .skel-content-col { display: grid; gap: 6px; padding-top: 2px; }
    .skel-title    { height: 11px; width: 70%; }
    .skel-meta     { height: 9px;  width: 45%; }
    .skel-location { height: 9px;  width: 55%; }
  </style>
</head>
<body>
  <div class="demo-label">V1 — Skeleton row (title + meta shimmer)</div>
  <div class="calendar-card">
    <button class="calendar-toggle" type="button">
      <span>
        <span class="calendar-title">Rock Warblers Trail Blazing Invitational</span>
        <span class="calendar-range">Friday, June 19, 2026</span>
      </span>
      <span class="calendar-chevron">▾</span>
    </button>
    <div class="calendar-body">
      <ol class="calendar-days">
        <!-- One skeleton row, shaped like a real calendar-row -->
        <li>
          <div class="skel-row">
            <div class="skel-day-col">
              <div class="skel skel-day-abbr"></div>
              <div class="skel skel-day-num"></div>
            </div>
            <div class="skel-content-col">
              <div class="skel skel-title"></div>
              <div class="skel skel-meta"></div>
              <div class="skel skel-location"></div>
            </div>
          </div>
        </li>
        <li>
          <div class="skel-row">
            <div class="skel-day-col">
              <div class="skel skel-day-abbr"></div>
              <div class="skel skel-day-num"></div>
            </div>
            <div class="skel-content-col">
              <div class="skel skel-title" style="width:58%"></div>
              <div class="skel skel-meta" style="width:38%"></div>
            </div>
          </div>
        </li>
        <li>
          <div class="skel-row">
            <div class="skel-day-col">
              <div class="skel skel-day-abbr"></div>
              <div class="skel skel-day-num"></div>
            </div>
            <div class="skel-content-col">
              <div class="skel skel-title" style="width:80%"></div>
              <div class="skel skel-meta" style="width:50%"></div>
              <div class="skel skel-location" style="width:40%"></div>
            </div>
          </div>
        </li>
      </ol>
    </div>
  </div>
</body>
</html>
