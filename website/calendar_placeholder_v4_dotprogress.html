<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calendar Placeholder — V4 Dot Progress</title>
  <style>
    :root {
      --brown-ink: #2e2418;
      --brown-mid: #4e4128;
      --brown-dark: #2a1f12;
      --brown-soft: #5a4828;
      --cream-hover: #efe2c6;
      --cream-surface: rgba(250, 246, 235, 0.96);
      --cream-border: #d8cdb4;
      --control-bg: #fffdf5;
      --control-border: #b9aa88;
      --moss: #5f7157;
      --moss-dark: #384833;
      --moss-soft: #e3ebdc;
      --rust: #a85020;
    }
    body {
      margin: 0; padding: 24px; font-family: Inter, system-ui, sans-serif;
      background: #d8ccb6;
    }
    .demo-label {
      font: 700 0.72rem Inter, system-ui, sans-serif;
      text-transform: uppercase; letter-spacing: 0.06em;
      color: var(--brown-mid); margin-bottom: 10px;
    }
    /* ── Calendar card chrome ── */
    .calendar-card {
      display: block; padding: 0; overflow: hidden;
      border: 1px solid rgba(155,132,92,0.34); border-radius: 8px;
      background: var(--cream-surface); box-shadow: 0 8px 28px rgba(0,0,0,0.18);
      width: 296px;
    }
    .calendar-toggle {
      width: 100%; display: grid; grid-template-columns: minmax(0,1fr) auto;
      align-items: center; gap: 8px; margin: 0; padding: 8px 10px;
      border: 0; background: transparent; color: var(--brown-ink);
      cursor: pointer; text-align: left; box-sizing: border-box;
    }
    .calendar-title {
      display: block; font: 800 0.78rem Inter, system-ui, sans-serif;
      text-transform: uppercase;
    }
    .calendar-range { display: block; margin-top: 1px; font-size: 0.76rem; color: var(--brown-soft); }
    .calendar-chevron { color: var(--brown-mid); font-size: 1.15rem; line-height: 1; }
    .calendar-body { padding: 0 8px 8px; }
    .calendar-days { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
    .calendar-days li { margin: 0; padding: 0; border-top: 1px solid var(--cream-border); }

    /* ── Dot-wave progress row ──
       Three dots that wave in sequence, giving a friendly "thinking" feel
       that matches the warm-paper aesthetic. Shaped like a real calendar row
       so the card height stays stable when real rows replace the placeholder. */
    @keyframes dot-wave {
      0%, 80%, 100% { transform: translateY(0);   opacity: 0.38; }
      40%            { transform: translateY(-5px); opacity: 1;    }
    }
    .dot-row {
      display: grid;
      grid-template-columns: 44px minmax(0,1fr);
      align-items: center;
      gap: 8px;
      padding: 10px 8px;
    }
    .dot-day-placeholder {
      display: flex; flex-direction: column; align-items: center;
      gap: 4px; padding-top: 2px;
    }
    .dot-day-line {
      border-radius: 3px;
      background: var(--cream-border);
    }
    .dot-day-line:first-child { height: 8px; width: 26px; }
    .dot-day-line:last-child  { height: 8px; width: 16px; }

    .dot-wave-track {
      display: flex; align-items: center; gap: 5px;
    }
    .dot-wave-track span {
      display: block;
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--brown-soft);
      animation: dot-wave 1.3s ease-in-out infinite;
    }
    .dot-wave-track span:nth-child(2) { animation-delay: 0.18s; }
    .dot-wave-track span:nth-child(3) { animation-delay: 0.36s; }
    .dot-wave-label {
      margin-left: 8px;
      font-size: 0.78rem; color: var(--brown-soft);
      letter-spacing: 0.01em;
    }
  </style>
</head>
<body>
  <div class="demo-label">V4 — Dot-wave progress (three staggered dots)</div>
  <div class="calendar-card">
    <button class="calendar-toggle" type="button">
      <span>
        <span class="calendar-title">Rock Warblers Trail Blazing Invitational</span>
        <span class="calendar-range">Friday, June 19, 2026</span>
      </span>
      <span class="calendar-chevron">▾</span>
    </button>
    <div class="calendar-body">
      <ol class="calendar-days">
        <li>
          <div class="dot-row" role="status" aria-label="Loading schedule">
            <div class="dot-day-placeholder">
              <div class="dot-day-line"></div>
              <div class="dot-day-line"></div>
            </div>
            <div class="dot-wave-track">
              <span></span>
              <span></span>
              <span></span>
              <span class="dot-wave-label">Loading schedule</span>
            </div>
          </div>
        </li>
      </ol>
    </div>
  </div>
</body>
</html>
