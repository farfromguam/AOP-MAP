<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bottom bar — V5 edit FAB + info·credits footer</title>
<style>
  :root{
    --brown-ink:#2e2418; --brown-mid:#4e4128; --brown-dark:#2a1f12; --brown-soft:#5a4828;
    --cream-hover:#efe2c6; --cream-surface:rgba(250,246,235,0.96); --cream-border:#d8cdb4;
    --control-bg:#fffdf5; --control-border:#b9aa88;
    --moss:#5f7157; --moss-dark:#384833; --moss-soft:#e3ebdc; --rust:#a85020;
    --hairline:rgba(46,36,24,0.14); --panel-bg:rgba(255,255,255,0.94);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{ font:15px/1.4 Inter,system-ui,sans-serif; color:var(--brown-ink);
    background:#cfc6ac; display:grid; place-items:center; min-height:100vh; padding:20px;}
  .phone{ position:relative; width:390px; height:620px; border-radius:34px; overflow:hidden;
    box-shadow:0 18px 50px rgba(0,0,0,0.28), 0 0 0 9px #1c160e, 0 0 0 10px #2e2418;
    background:#9aa07e;
    background-image:
      radial-gradient(120% 120% at 20% 10%, #a9ad8a 0%, #8f9573 55%, #7e845f 100%),
      repeating-linear-gradient(58deg, rgba(60,70,45,0.10) 0 1px, transparent 1px 26px),
      repeating-linear-gradient(122deg, rgba(60,70,45,0.08) 0 1px, transparent 1px 34px);}
  .railhint{ position:absolute; left:12px; top:14px; width:150px; height:120px; border-radius:10px;
    background:var(--cream-surface); border:1px solid var(--cream-border); opacity:0.45;}
  .home-ind{ position:absolute; left:50%; bottom:7px; transform:translateX(-50%); width:120px; height:4px;
    border-radius:3px; background:rgba(0,0,0,0.30); z-index:6;}

  /* === V5: the edit panel collapses to ONE round pencil button (a FAB) in the
     bottom-right, clear of the home indicator because it is interactive. The
     publish status + the map attribution share a single low footer line on the
     left — the ⓘ opens the full per-source credit list, the count rides beside
     it. Export (⧉) is no longer on the bar; it lives inside the panel once
     opened. === */
  .edit-fab{ position:absolute; right:12px; bottom:46px; z-index:5;
    width:52px; height:52px; border-radius:50%; border:0; cursor:pointer;
    display:grid; place-items:center; color:#fff7e9; background:var(--rust);
    box-shadow:0 8px 22px rgba(120,52,18,0.42), 0 0 0 4px rgba(255,253,245,0.55);}
  .edit-fab svg{ width:23px; height:23px;}
  .edit-fab:hover{ filter:brightness(1.05);}

  .footer-info{ position:absolute; left:10px; right:74px; bottom:12px; z-index:4;
    display:flex; align-items:center; gap:8px; min-width:0;
    padding:6px 11px; border-radius:9px;
    background:rgba(46,36,24,0.78); color:#f0e8d6; font-size:0.78rem; backdrop-filter:blur(2px);}
  .fi-credit{ display:inline-flex; align-items:center; gap:5px; cursor:pointer;
    color:#f0e8d6; white-space:nowrap; flex:0 0 auto;}
  .fi-credit svg{ width:14px; height:14px; opacity:0.92;}
  .fi-sep{ width:1px; align-self:stretch; background:rgba(255,255,255,0.22); flex:0 0 auto;}
  .fi-status{ display:inline-flex; align-items:center; gap:6px; min-width:0;}
  .fi-status .dot{ width:8px; height:8px; border-radius:50%; background:#8fae7f; flex:0 0 auto;
    box-shadow:0 0 0 2px rgba(143,174,127,0.30);}
  .fi-status b{ color:#fff; font-weight:800;}
  .fi-status span{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}

  /* popped credit sheet (what tapping ⓘ reveals — the "more footer information") */
  .credits{ position:absolute; left:10px; right:10px; bottom:110px; z-index:7;
    background:var(--control-bg); border:1px solid var(--cream-border); border-radius:11px;
    box-shadow:0 14px 40px rgba(0,0,0,0.28); padding:11px 13px;}
  .credits h3{ margin:0 0 7px; font-size:0.74rem; text-transform:uppercase; letter-spacing:0.05em;
    color:var(--brown-dark);}
  .credits ul{ margin:0; padding:0; list-style:none; display:grid; gap:3px;
    font-size:0.76rem; color:var(--brown-soft); line-height:1.4;}
  .credits li b{ color:var(--brown-dark); font-weight:700;}

  .caption{ position:absolute; left:8px; right:8px; bottom:78px;
    background:rgba(46,36,24,0.82); color:#f3ecdc; font-size:0.76rem; line-height:1.45;
    padding:9px 12px; border-radius:8px; z-index:5;}
  .caption b{ color:#fff; }
</style>
</head>
<body>
  <div class="phone">
    <div class="railhint"></div>

    <div class="caption"><b>V5 · Edit FAB + info·credits footer.</b> The whole edit panel
      collapses to <b>one</b> round pencil button. The publish status and the map
      attribution share one low footer line — tap <b>ⓘ</b> for the full source list.</div>

    <!-- the single button -->
    <button class="edit-fab" title="Open edit panel">
      <svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.7"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M14.5 3.5l4 4L8 18l-4.5 1L4.5 14.5 14.5 3.5z"/>
      </svg>
    </button>

    <!-- info + attribution, one home -->
    <div class="footer-info">
      <span class="fi-credit" title="Map sources &amp; credits">
        <svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
          <circle cx="11" cy="11" r="8.2"/><path d="M11 10v5" stroke-linecap="round"/><circle cx="11" cy="6.7" r="0.5" fill="currentColor" stroke-width="1.4"/>
        </svg>
        Sources
      </span>
      <span class="fi-sep"></span>
      <span class="fi-status"><span class="dot"></span><span><b>5</b> published</span></span>
    </div>

    <div class="home-ind"></div>
  </div>
</body>
</html>
