<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Map border V6 — Checker neatline</title>
<style>
  :root{
    --brown-ink:#2e2418; --brown-mid:#4e4128; --brown-dark:#2a1f12; --brown-soft:#5a4828;
    --rust:#a85020; --moss-dark:#384833;
    --paper:#e9e0cb; --ink:#2a1f12; --band:34px; --check:13px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0; height:100%; overflow:hidden; background:var(--paper);
    font-family:Inter,system-ui,sans-serif; color:var(--brown-ink);}
  .map{position:fixed; inset:0; background:var(--paper) url('img/map_sample.png') center/contain no-repeat;}
  .map::after{content:""; position:absolute; inset:0;
    background:radial-gradient(120% 120% at 50% 48%, transparent 54%, var(--paper) 90%); opacity:0.9;}

  .frame{position:fixed; inset:0; pointer-events:none; z-index:5;
    box-shadow: inset 0 0 0 var(--band) var(--paper);}
  /* Inner & outer hairlines bracketing the checker band. */
  .rule{position:absolute; border:1px solid var(--ink);}
  .rule.out{inset:9px;}
  .rule.in{inset:var(--band);}
  /* Alternating ink/paper blocks — the classic quad neatline, drawn per edge. */
  .check{position:absolute; background-color:var(--paper);}
  .check.t{top:18px; left:18px; right:18px; height:8px;
    background-image:repeating-linear-gradient(to right, var(--ink) 0 var(--check), var(--paper) var(--check) calc(var(--check)*2));}
  .check.b{bottom:18px; left:18px; right:18px; height:8px;
    background-image:repeating-linear-gradient(to right, var(--ink) 0 var(--check), var(--paper) var(--check) calc(var(--check)*2));}
  .check.l{left:18px; top:18px; bottom:18px; width:8px;
    background-image:repeating-linear-gradient(to bottom, var(--ink) 0 var(--check), var(--paper) var(--check) calc(var(--check)*2));}
  .check.r{right:18px; top:18px; bottom:18px; width:8px;
    background-image:repeating-linear-gradient(to bottom, var(--ink) 0 var(--check), var(--paper) var(--check) calc(var(--check)*2));}
  .corner-tick{position:absolute; width:8px; height:8px; background:var(--ink);}
  .corner-tick.tl{top:18px; left:18px;} .corner-tick.tr{top:18px; right:18px;}
  .corner-tick.bl{bottom:18px; left:18px;} .corner-tick.br{bottom:18px; right:18px;}
  .coord{position:absolute; font:700 9px ui-monospace,Menlo,monospace; color:var(--brown-mid);
    letter-spacing:0.02em;}
  .coord.tl{top:4px; left:30px;} .coord.tr{top:4px; right:30px;}
  .coord.bl{bottom:3px; left:30px;} .coord.br{bottom:3px; right:30px;}
  .quad{position:absolute; top:3px; left:50%; transform:translateX(-50%);
    font:800 9.5px Inter,system-ui,sans-serif; letter-spacing:0.3em; text-transform:uppercase;
    color:var(--brown-dark);}
</style>
</head>
<body>
  <div class="map"></div>
  <div class="frame">
    <div class="rule out"></div>
    <div class="check t"></div><div class="check b"></div>
    <div class="check l"></div><div class="check r"></div>
    <div class="corner-tick tl"></div><div class="corner-tick tr"></div>
    <div class="corner-tick bl"></div><div class="corner-tick br"></div>
    <div class="rule in"></div>
    <span class="coord tl">35°02′</span><span class="coord tr">85°34′</span>
    <span class="coord bl">34°59′</span><span class="coord br">85°38′</span>
    <span class="quad">AOP Quadrangle · TN</span>
  </div>
</body>
</html>
