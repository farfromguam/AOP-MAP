<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2e2a22">
<title>AOP · Data Editor</title>
<link href="./vendor/maplibre-gl.css" rel="stylesheet">
</head>
<body>
<!-- The data editor is grid + map. V1 side-dock (grid left / satellite map
     pinned right) with preview A below the map: the faithful card showing how
     the selected feature reads when it's active on the public map. The whole
     editor — manifest dropdown, round-trip-safe grid, per-file localStorage
     autosave + close-flush, add/delete/export/reset, the map, two-way selection
     sync, and the preview — is built by js/data_editor_map.js. feature_display.js
     gives the preview the SAME feature-to-text strategy the public viewer uses,
     so the card reads exactly what the live map will. -->
<script>window.AOP_MAP_MODE = 'side-right'; window.AOP_PREVIEW_STYLE = 'popup';</script>
<script src="./vendor/maplibre-gl.js"></script>
<script src="./js/feature_display.js"></script>
<script src="./js/data_editor_map.js"></script>
</body>
</html>
