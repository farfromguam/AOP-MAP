<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bottom bar — V3 icon toolbar</title>
<style>
  :root{
    --brown-ink:#2e2418; --brown-mid:#4e4128; --brown-dark:#2a1f12; --brown-soft:#5a4828;
    --cream-hover:#efe2c6; --cream-surface:rgba(250,246,235,0.96); --cream-border:#d8cdb4;
    --control-bg:#fffdf5; --control-border:#b9aa88;
    --moss:#5f7157; --moss-dark:#384833; --moss-soft:#e3ebdc; --rust:#a85020;
    --hairline:rgba(46,36,24,0.14); --cream-wash-hover:#f1e8d2; --tab-h:44px;
    --panel-bg:rgba(255,255,255,0.94);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{ font:15px/1.4 Inter,system-ui,sans-serif; color:var(--brown-ink);
    background:#cfc6ac; display:grid; place-items:center; min-height:100vh; padding:20px;}
  .phone{ position:relative; width:390px; height:620px; border-radius:34px; overflow:hidden;
    box-shadow:0 18px 50px rgba(0,0,0,0.28), 0 0 0 9px #1c160e, 0 0 0 10px #2e2418;
    background:#9aa07e;
    background-image:
      radial-gradient(120% 120% at 20% 10%, #a9ad8a 0%, #8f9573 55%, #7e845f 100%),
      repeating-linear-gradient(58deg, rgba(60,70,45,0.10) 0 1px, transparent 1px 26px),
      repeating-linear-gradient(122deg, rgba(60,70,45,0.08) 0 1px, transparent 1px 34px);}
  .railhint{ position:absolute; left:12px; top:14px; width:150px; height:120px; border-radius:10px;
    background:var(--cream-surface); border:1px solid var(--cream-border); opacity:0.45;}
  .home-ind{ position:absolute; left:50%; bottom:7px; transform:translateX(-50%); width:120px; height:4px;
    border-radius:3px; background:rgba(0,0,0,0.30); z-index:6;}

  /* === V3: tightest. Words mostly gone — a pencil glyph + "Edit", then a live
     status dot (green = loaded) and the two icon actions. Most map showing,
     status reduced to a single dot you read at a glance. === */
  .botbar{ position:absolute; left:8px; right:8px; bottom:22px; z-index:4;
    display:flex; align-items:center; gap:8px; height:38px; padding:0 9px 0 11px;
    background:var(--panel-bg); border-radius:11px;
    box-shadow:0 10px 35px rgba(0,0,0,0.18);}
  .bb-lead{ flex:1 1 auto; min-width:0; display:flex; align-items:center; gap:7px;
    color:var(--brown-mid); font-size:0.88rem; font-weight:700;}
  .bb-lead svg{ width:17px; height:17px; flex:0 0 auto;}
  .bb-statusdot{ flex:0 0 auto; width:10px; height:10px; border-radius:50%; background:var(--moss);
    box-shadow:0 0 0 2px rgba(95,113,87,0.22);}
  .bb-btn{ flex:0 0 auto; display:inline-grid; place-items:center; width:28px; height:24px;
    border:1px solid #d8d0bd; border-radius:6px; background:#fff8e8; color:var(--brown-mid);
    cursor:pointer; line-height:1; font-size:0.95rem;}
  .bb-btn:hover{ background:var(--cream-hover); color:var(--brown-dark); border-color:#c8b8a0;}

  .caption{ position:absolute; left:8px; right:8px; bottom:74px;
    background:rgba(46,36,24,0.82); color:#f3ecdc; font-size:0.76rem; line-height:1.45;
    padding:9px 12px; border-radius:8px; z-index:5;}
  .caption b{ color:#fff; }
</style>
</head>
<body>
  <div class="phone">
    <div class="railhint"></div>
    <div class="caption"><b>V3 · Icon toolbar.</b> Most minimal — "AOP edit panel" shrinks
      to a pencil + "Edit", the publish status becomes a single green load dot. Smallest
      footprint, most map. (Count only on tap.)</div>
    <div class="botbar">
      <div class="bb-lead">
        <svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.6"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M14.5 3.5l4 4L8 18l-4.5 1L4.5 14.5 14.5 3.5z"/>
        </svg>
        Edit
      </div>
      <span class="bb-statusdot" title="5 publish features loaded"></span>
      <button class="bb-btn" title="Export all">&#x29C9;</button>
      <button class="bb-btn" title="Expand panel">&#9656;</button>
    </div>
    <div class="home-ind"></div>
  </div>
</body>
</html>
