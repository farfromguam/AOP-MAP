<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Left rail v5 — two-column drawer (icons + content, float-down)</title>
  <style>
    /* ── Palette (parity with index.html + v2's flat-mode additions) ─────── */
    :root {
      --brown-ink: #4a3c2a;
      --brown-mid: #6b5a3e;
      --brown-dark: #3f3122;
      --brown-soft: #6a5638;
      --cream-hover: #efe2c6;
      --cream-surface: rgba(250, 246, 235, 0.98);
      --cream-surface-solid: #faf6eb;
      --cream-border: #d8cdb4;
      --control-bg: #fffdf5;
      --control-border: #b9aa88;
      --moss: #5f7157;
      --moss-dark: #384833;
      --moss-soft: #e3ebdc;
      --rust: #9a5a32;

      /* Flat-mode tokens borrowed from v2 */
      --hairline: rgba(74, 60, 42, 0.08);
      --moss-tint-hover: #d6e0cb;
      --cream-wash-hover: #f1e8d2;

      /* One tab unit drives icon size, icon-col min height, and any
         content row that should align flush with a single tab. */
      --tab-h: 44px;
    }
    * { box-sizing: border-box; }
    body, html { margin: 0; padding: 0; height: 100%;
      font-family: Inter, system-ui, sans-serif; color: var(--brown-ink); }

    /* ── Faux map background ─────────────────────────────────────────────── */
    .map {
      position: absolute; inset: 0;
      background:
        radial-gradient(ellipse 60% 50% at 70% 40%, rgba(95,113,87,0.42), transparent 70%),
        radial-gradient(ellipse 45% 35% at 30% 70%, rgba(154,90,50,0.22), transparent 70%),
        repeating-linear-gradient(120deg, rgba(74,60,42,0.05) 0 1px, transparent 1px 22px),
        repeating-linear-gradient(60deg, rgba(74,60,42,0.04) 0 1px, transparent 1px 28px),
        linear-gradient(180deg, #e2dcc6 0%, #d8cfb0 60%, #c8bf9c 100%);
    }
    .map svg.contours { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0.42; }
    .map .corner-attrib { position: absolute; bottom: 6px; left: 8px; font-size: 0.7rem;
      color: rgba(74,60,42,0.65); z-index: 1; }

    /* ── Pill-bar (verbatim chrome from index.html:36-43) ─────────────────
       Global map controls — zoom presets, view presets, 3D toggle. Lives
       at the top of the left rail above the manilla drawer. ──────────── */
    .pill-bar { display: grid; grid-template-columns: 3fr 3fr 1fr; gap: 8px; align-items: stretch; }
    .pill-bar .pill { display: flex; width: 100%; border: 1px solid var(--control-border); border-radius: 999px; background: var(--control-bg); overflow: hidden; box-shadow: 0 8px 28px rgba(0,0,0,0.18); }
    .pill-bar .pill > button { flex: 1; min-width: 0; min-height: 36px; padding: 6px 8px; border: 0; background: transparent; color: var(--brown-ink); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
    .pill-bar .pill > button + button { border-left: 1px solid var(--control-border); }
    .pill-bar .pill > button:hover:not(.active):not(:disabled) { background: var(--cream-hover); }
    .pill-bar .pill > button.active { background: var(--moss); color: var(--control-bg); border-left-color: transparent; }
    .pill-bar .pill > button svg { width: 22px; height: 22px; }
    .pill-bar .pill > button.terrain-button { font: 800 0.86rem Inter, system-ui, sans-serif; letter-spacing: 0.04em; }

    /* ── Left rail container ─────────────────────────────────────────────
       Stacks pill-bar above the drawer with the same 8px gap as the real
       .left-controls in index.html:29. In integration, this wrapper is
       replaced by .left-controls — only the .drawer subtree ports over. */
    .left-rail { position: absolute; left: 12px; top: 12px; z-index: 3;
      width: 404px; display: grid; gap: 8px; }

    /* ── Drawer: col1 icons + col2 content ────────────────────────────────
       Two flex columns. Col1 (icon-col) holds three 44×44 tab buttons with
       a min height of 132 (3 × --tab-h). Col2 (content-col) is 360 wide
       and as tall as the open panels stacked inside it. Panels float to
       the top of col2 in tab order. Icons stay in canonical order (search,
       hot, cal) but can shift DOWN — never up — to align with their
       panel's top in col2 (see margin loop in render()). When col2 is
       shorter than col1, the icon strip extends below alone (L shape, with
       bottom-right of icon-col rounded); when col2 is taller, icon-col
       stretches via align-items:stretch so its cream bottom matches. */
    .drawer-wrap { position: relative; }

    .drawer {
      display: flex;
      align-items: stretch;     /* icon-col stretches to match content-col */
    }

    .icon-col {
      flex: 0 0 var(--tab-h);
      width: var(--tab-h);
      min-height: calc(var(--tab-h) * 3);  /* 3 tab slots; stretches if col2 is taller */
      display: flex;
      flex-direction: column;
      background: var(--cream-surface);
      border: 1px solid var(--cream-border);
      border-radius: 8px 0 0 8px;
      overflow: hidden;
      position: relative;
    }
    .icon-col.standalone { border-radius: 8px; }
    .icon-col.col2-short { border-bottom-right-radius: 8px; }

    .content-col {
      flex: 0 0 360px;
      width: 360px;
      align-self: flex-start;   /* don't stretch when col2 is the short one */
      display: flex;
      flex-direction: column;
      background: var(--cream-surface);
      border: 1px solid var(--cream-border);
      border-left: 0;           /* shared edge with icon-col */
      border-radius: 0 8px 8px 0;
      overflow: hidden;
      position: relative;
    }
    .content-col[hidden] { display: none; }

    /* ── Tabs (icon buttons, not layout objects) ─────────────────────── */
    .tab {
      position: relative;
      flex: 0 0 var(--tab-h);
      width: var(--tab-h); height: var(--tab-h);
      display: grid; place-items: center;
      border: 0;
      background: transparent;
      color: var(--brown-mid);
      cursor: pointer;
      transition: background 0.12s ease, color 0.12s ease;
    }
    .tab svg { width: 22px; height: 22px; }
    .tab + .tab { border-top: 1px solid var(--hairline); }
    .tab:hover { background: var(--cream-wash-hover); }
    .tab:focus-visible { outline: 2px solid var(--moss); outline-offset: -2px; }

    .tab.open {
      background: var(--moss-soft);
      color: var(--moss-dark);
    }
    .tab.open:hover { background: var(--moss-tint-hover); }

    /* ── Panels (content that pops in/out of col2) ──────────────────── */
    .panel { display: none; position: relative; min-width: 0; }
    .panel.open { display: block; }
    .panel.open ~ .panel.open { border-top: 1px solid var(--hairline); }

    /* ── Live indicator on the hot tab ───────────────────────────────────
       Subdued in flat mode — small rust pip with a ring matching the
       surrounding fill so it sits cleanly over both closed and open states. */
    .live-dot {
      position: absolute; top: 6px; right: 6px;
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--rust);
      box-shadow: 0 0 0 1.5px var(--cream-surface);
      animation: pulse 2s ease-in-out infinite;
    }
    .tab.open .live-dot { box-shadow: 0 0 0 1.5px var(--moss-soft); }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50%      { transform: scale(1.18); }
    }

    .day-cap {
      position: absolute; bottom: 3px; left: 50%; transform: translateX(-50%);
      font: 800 0.52rem Inter, system-ui, sans-serif;
      letter-spacing: 0.04em; color: var(--brown-mid);
    }
    .tab.open .day-cap { color: var(--moss-dark); }

    /* Tooltip on closed tabs */
    .tab .label {
      position: absolute; left: 100%; margin-left: 10px; top: 50%;
      transform: translate(-4px, -50%);
      padding: 3px 9px; border-radius: 5px;
      background: var(--brown-dark); color: #f7f1e2;
      font-size: 0.74rem; white-space: nowrap;
      opacity: 0; pointer-events: none;
      transition: opacity 0.12s ease, transform 0.12s ease;
      z-index: 7;
    }
    .tab:not(.open):hover .label { opacity: 1; transform: translate(0, -50%); }

    /* ── Inner card chrome (shells stripped — drawer is the only shell) ──── */
    /* Pinned to one tab unit so the search row sits flush with the icon. */
    .search-shell {
      height: var(--tab-h);
      box-sizing: border-box;
      display: flex;
      align-items: center;
      padding: 0 10px;
    }
    .search-shell input {
      width: 100%;
      height: calc(var(--tab-h) - 12px);    /* 6px breath top + bottom */
      box-sizing: border-box;
      padding: 0 10px;
      font: inherit;
      border: 1px solid var(--control-border);
      border-radius: 6px;
      background: var(--control-bg);
      color: var(--brown-ink);
      transition: border-color 0.12s ease;
    }
    .search-shell input::placeholder { color: var(--brown-soft); }
    .search-shell input:focus { outline: 2px solid rgba(95,113,87,0.32); border-color: var(--moss); }

    .hot-control { display: grid; gap: 6px; padding: 8px 10px; }
    .hot-control-head { display: flex; align-items: baseline; justify-content: space-between;
      gap: 8px; padding: 0 2px; min-height: 24px; }
    .hot-control-title { font: 800 0.68rem Inter, system-ui, sans-serif; text-transform: uppercase; }
    .hot-control-status { font: 600 0.68rem Inter, system-ui, sans-serif; color: var(--brown-soft); }
    .hot-lanes { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
    .hot-button { width: 100%; min-height: 64px; display: grid; grid-template-columns: 22px minmax(0, 1fr);
      align-items: center; gap: 7px; padding: 8px 9px; border: 1px solid rgba(85, 67, 44, 0.25);
      border-radius: 6px; color: #f7f1e2; cursor: default; text-align: left;
      font: 700 0.74rem Inter, system-ui, sans-serif; text-transform: uppercase; }
    .hot-button.hot-now { background: var(--rust); }
    .hot-button.trail-hot { background: var(--moss); }
    .hot-glyph { display: inline-flex; align-items: center; justify-content: center;
      width: 24px; height: 24px; font-size: 1.1rem; line-height: 1; }
    .hot-text { display: block; min-width: 0; }
    .hot-title { display: block; }
    .hot-detail { display: block; margin-top: 1px; font: 400 0.72rem Inter, system-ui, sans-serif;
      text-transform: none; letter-spacing: 0; color: rgba(247, 241, 226, 0.88); }

    .calendar-card { overflow: hidden; }
    .left-tabs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 3px;
      padding: 5px; border-bottom: 1px solid var(--hairline); background: transparent; }
    .left-tab { min-width: 0; min-height: 30px; padding: 5px 4px; border: 1px solid transparent;
      border-radius: 5px; background: transparent; color: var(--brown-mid); cursor: default;
      font: 800 0.76rem Inter, system-ui, sans-serif; text-align: center;
      transition: background 0.12s ease, color 0.12s ease; }
    .left-tab.active { background: var(--moss-soft); color: var(--moss-dark);
      box-shadow: inset 0 -2px 0 var(--moss); }
    .calendar-toggle { width: 100%; display: grid; grid-template-columns: minmax(0, 1fr) auto;
      align-items: center; gap: 8px; padding: 8px 10px; border: 0; background: transparent;
      color: var(--brown-ink); cursor: default; text-align: left; }
    .calendar-title { display: block; font: 800 0.78rem Inter, system-ui, sans-serif; text-transform: uppercase; }
    .calendar-range { display: block; margin-top: 1px; font-size: 0.76rem; color: var(--brown-soft); }
    .calendar-chevron { color: var(--brown-mid); font-size: 1.15rem; line-height: 1; }
    .calendar-body { max-height: 320px; overflow-y: auto; padding: 0 8px 8px; }
    .calendar-days { list-style: none; display: grid; gap: 4px; margin: 0; padding: 0; }
    .calendar-days li { padding: 0; border-top: 1px solid var(--hairline); position: relative; }
    .calendar-row { width: 100%; display: grid; grid-template-columns: 44px minmax(0, 1fr);
      align-items: start; gap: 8px; padding: 7px 8px; border: 0; background: transparent;
      color: var(--brown-ink); text-align: left; cursor: default; }
    .calendar-day { padding-top: 2px; font: 800 0.68rem Inter, system-ui, sans-serif;
      text-transform: uppercase; color: var(--brown-mid); }
    .calendar-time { display: block; font: 700 0.74rem Inter, system-ui, sans-serif;
      line-height: 1.15; color: var(--brown-soft); }
    .calendar-name { display: block; margin-top: 1px; font-size: 0.88rem; line-height: 1.18; }
    .calendar-location { display: block; margin-top: 2px; font-size: 0.74rem;
      line-height: 1.15; color: var(--brown-soft); }
    .calendar-days li[data-state="happening"] { background: #dde2cf; box-shadow: inset 3px 0 0 0 var(--rust); }
    .calendar-days li[data-state="happening"] .calendar-name { font-weight: 700; }
    .calendar-days li[data-state="upcoming_next"] { background: #ecd9b1; box-shadow: inset 3px 0 0 0 var(--brown-dark); }
    .cal-live-badge, .cal-soon-badge { position: absolute; top: 8px; right: 8px; padding: 1px 6px;
      border-radius: 3px; font: 700 9px Inter, system-ui, sans-serif; text-transform: uppercase;
      color: #f7f1e2; pointer-events: none; }
    .cal-live-badge { background: var(--rust); }
    .cal-soon-badge { background: var(--brown-dark); }
  </style>
</head>
<body>

  <!-- Faux map background -->
  <div class="map">
    <svg class="contours" viewBox="0 0 100 100" preserveAspectRatio="none">
      <g fill="none" stroke="#5a4630" stroke-width="0.15">
        <path d="M0 30 Q 20 25, 40 32 T 80 28 T 100 30" />
        <path d="M0 40 Q 25 35, 45 42 T 85 38 T 100 41" />
        <path d="M0 50 Q 30 45, 50 52 T 90 48 T 100 51" />
        <path d="M0 60 Q 22 56, 48 62 T 88 58 T 100 61" />
        <path d="M0 70 Q 28 67, 52 72 T 92 68 T 100 71" />
      </g>
      <g fill="none" stroke="#9a5a32" stroke-width="0.3" stroke-linecap="round">
        <path d="M22 78 Q 38 60, 52 56 T 78 38" />
        <path d="M58 80 Q 64 64, 70 50 T 80 32" />
      </g>
    </svg>
    <div class="corner-attrib">© OpenStreetMap · NAIP · AOP private — mockup background</div>
  </div>

  <!-- ── Left rail: pill-bar (real chrome from index.html:335-362) + drawer ── -->
  <div class="left-rail">
    <div class="pill-bar" role="group" aria-label="Map view controls">
      <div class="pill zoom-bar" role="group" aria-label="Zoom to area">
        <button id="zoomRegion" type="button" data-view="region" title="Zoom out to the full 9-patch region" aria-label="Region zoom">
          <svg viewBox="0 0 22 22" aria-hidden="true"><path d="M3 8V3h5M14 3h5v5M19 14v5h-5M8 19H3v-5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        </button>
        <button id="zoomPark" type="button" data-view="park" title="Fit the AOP park boundary" aria-label="Fit park boundary">
          <svg viewBox="0 0 22 22" aria-hidden="true"><path d="M4 7L7 3L15 4L18 9L17 16L9 18L4 14Z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><circle cx="11" cy="11" r="1.6" fill="currentColor"/></svg>
        </button>
        <button id="zoomPavilion" type="button" data-view="pavilion" title="Zoom in tight on the pavilion" aria-label="Pavilion zoom">
          <svg viewBox="0 0 22 22" aria-hidden="true"><path d="M3 9L11 3L19 9" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M5 9V18M9 9V18M13 9V18M17 9V18" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><path d="M3 18H19" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
        </button>
      </div>
      <div class="pill preset-bar" role="group" aria-label="Map preset">
        <button id="presetPark" type="button" data-preset="park" class="active" title="Park preset (default map)" aria-label="Park preset">
          <svg viewBox="0 0 22 22" aria-hidden="true"><path d="M3 6L8 4L14 6L19 4V16L14 18L8 16L3 18Z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M8 4V16M14 6V18" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>
        </button>
        <button id="presetTopo" type="button" data-preset="topo" title="Topo preset (contour-led)" aria-label="Topo preset">
          <svg viewBox="0 0 22 22" aria-hidden="true"><path d="M3 7c3-2 6-2 9 0s5 2 7 0M3 11c3-2 6-2 9 0s5 2 7 0M3 15c3-2 6-2 9 0s5 2 7 0" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        </button>
        <button id="presetTrace" type="button" data-preset="trace" title="Trace preset (NAIP aerial)" aria-label="Trace preset">
          <svg viewBox="0 0 22 22" aria-hidden="true"><rect x="3" y="3" width="16" height="16" rx="2" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M5 16c2-1 3-4 6-4s4 3 6 2" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><circle cx="6" cy="16" r="1.3" fill="currentColor"/><circle cx="17" cy="14" r="1.3" fill="currentColor"/></svg>
        </button>
      </div>
      <div class="pill" role="group" aria-label="3D toggle">
        <button id="terrainButton" type="button" class="terrain-button" aria-pressed="false" title="Toggle 3D terrain view">3D</button>
      </div>
    </div>

    <!-- ── Drawer: col1 (icons) + col2 (content) ───────────────────── -->
    <div class="drawer-wrap">
    <div class="drawer" id="drawer">

      <div class="icon-col" id="iconCol">
        <button class="tab open" type="button" id="tabSearch"
                data-card="search" aria-pressed="true" title="Toggle search">
          <svg viewBox="0 0 22 22" fill="none">
            <circle cx="9.5" cy="9.5" r="6" stroke="currentColor" stroke-width="1.6"/>
            <path d="M14.2 14.2 L19 19" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          </svg>
          <span class="label">Search</span>
        </button>

        <button class="tab open" type="button" id="tabHot"
                data-card="hot" aria-pressed="true" title="Toggle Hot now">
          <svg viewBox="0 0 22 22" fill="none">
            <path d="M11 3.5 C 12 6.5, 14.5 7.5, 14.5 11
                     C 14.5 14, 12.7 16, 11 16
                     C 9.3 16, 7.5 14, 7.5 11.5
                     C 7.5 10, 8.2 9.4, 8.8 10
                     C 9.4 10.6, 9.5 9.5, 9 8 C 8.7 6.5, 9.5 5, 11 3.5 Z"
                  stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
          </svg>
          <span class="live-dot" aria-hidden="true" title="Stage 3 LIVE"></span>
          <span class="label">Hot now · Stage 3 LIVE</span>
        </button>

        <button class="tab open" type="button" id="tabCal"
                data-card="cal" aria-pressed="true" title="Toggle calendar">
          <svg viewBox="0 0 22 22" fill="none">
            <rect x="3.2" y="5.2" width="15.6" height="13.6" rx="1.6"
                  stroke="currentColor" stroke-width="1.5"/>
            <path d="M3.2 9.2 H 18.8" stroke="currentColor" stroke-width="1.5"/>
            <path d="M7.5 3 V 7 M14.5 3 V 7"
                  stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            <path d="M6 13 H 10 M12 13 H 16 M6 16 H 10 M12 16 H 16"
                  stroke="currentColor" stroke-width="1" stroke-linecap="round"/>
          </svg>
          <span class="day-cap">SAT</span>
          <span class="label">Sat 2:00pm Stage 3 — Mud Pit</span>
        </button>
      </div>

      <div class="content-col" id="contentCol">
        <div class="panel open" id="panelSearch" data-card="search">
          <div class="search-shell">
            <input type="text" placeholder="Search the map…" />
          </div>
        </div>

        <div class="panel open" id="panelHot" data-card="hot">
          <section class="hot-control" aria-label="Hot now">
            <div class="hot-control-head">
              <span class="hot-control-title">Hot now</span>
              <span class="hot-control-status">Sat 2:14 pm</span>
            </div>
            <div class="hot-lanes">
              <button class="hot-button hot-now" type="button">
                <span class="hot-glyph">●</span>
                <span class="hot-text">
                  <span class="hot-title">Stage 3</span>
                  <span class="hot-detail">Running now</span>
                </span>
              </button>
              <button class="hot-button trail-hot" type="button">
                <span class="hot-glyph">❖</span>
                <span class="hot-text">
                  <span class="hot-title">Trail activity</span>
                  <span class="hot-detail">Where rigs spent time</span>
                </span>
              </button>
            </div>
          </section>
        </div>

        <div class="panel open" id="panelCal" data-card="cal">
          <section class="calendar-card">
            <div class="left-tabs">
              <button class="left-tab active" type="button">Events</button>
              <button class="left-tab" type="button">Park</button>
              <button class="left-tab" type="button">About</button>
            </div>
            <button class="calendar-toggle" type="button">
              <span>
                <span class="calendar-title">Event calendar</span>
                <span class="calendar-range">Draft Fri-Sun schedule</span>
              </span>
              <span class="calendar-chevron">▾</span>
            </button>
            <div class="calendar-body">
              <ol class="calendar-days">
                <li>
                  <div class="calendar-row">
                    <span class="calendar-day">FRI</span>
                    <span>
                      <span class="calendar-time">6:00 pm</span>
                      <span class="calendar-name">Driver check-in</span>
                      <span class="calendar-location">Pavilion</span>
                    </span>
                  </div>
                </li>
                <li data-state="happening">
                  <span class="cal-live-badge">Live</span>
                  <div class="calendar-row">
                    <span class="calendar-day">SAT</span>
                    <span>
                      <span class="calendar-time">2:00 pm</span>
                      <span class="calendar-name">Stage 3 — Mud Pit</span>
                      <span class="calendar-location">Lower trace</span>
                    </span>
                  </div>
                </li>
                <li data-state="upcoming_next">
                  <span class="cal-soon-badge">Next</span>
                  <div class="calendar-row">
                    <span class="calendar-day">SAT</span>
                    <span>
                      <span class="calendar-time">4:00 pm</span>
                      <span class="calendar-name">Stage 4 — Cliff Loop</span>
                      <span class="calendar-location">Upper trace</span>
                    </span>
                  </div>
                </li>
                <li>
                  <div class="calendar-row">
                    <span class="calendar-day">SUN</span>
                    <span>
                      <span class="calendar-time">10:00 am</span>
                      <span class="calendar-name">Awards + Pull-Sled</span>
                      <span class="calendar-location">Pavilion</span>
                    </span>
                  </div>
                </li>
              </ol>
            </div>
          </section>
        </div>
      </div>

    </div>
    </div>
  </div>

  <script>
    // ── Drawer state + render ────────────────────────────────────────
    // Col1 (icon-col): three tab buttons in canonical order. Default flow
    // is 0/44/88 px; render() adds margin-top to each tab to push it down
    // to meet its panel's offsetTop in col2 (icons only float DOWN, never
    // up, and never reorder).
    // Col2 (content-col): open panels stacked in tab order at the top.
    // Click is a pure toggle.
    const CARDS = ['search', 'hot', 'cal'];
    const open  = { search: true, hot: true, cal: true };

    const iconCol    = document.getElementById('iconCol');
    const contentCol = document.getElementById('contentCol');
    const tabs   = { search: document.getElementById('tabSearch'),
                     hot:    document.getElementById('tabHot'),
                     cal:    document.getElementById('tabCal') };
    const panels = { search: document.getElementById('panelSearch'),
                     hot:    document.getElementById('panelHot'),
                     cal:    document.getElementById('panelCal') };

    // Read --tab-h once; if the token changes at runtime, re-read here.
    const TAB_H = parseInt(
      getComputedStyle(document.documentElement).getPropertyValue('--tab-h'),
      10
    ) || 44;

    function render() {
      const anyOpen = CARDS.some(c => open[c]);
      contentCol.hidden = !anyOpen;
      iconCol.classList.toggle('standalone', !anyOpen);

      CARDS.forEach(c => {
        const isOpen = !!open[c];
        tabs[c].classList.toggle('open', isOpen);
        tabs[c].setAttribute('aria-pressed', isOpen ? 'true' : 'false');
        panels[c].classList.toggle('open', isOpen);
      });

      // Float icons down to meet their panels. Icons keep their canonical
      // order (search, hot, cal) and only shift DOWN — never up. Closed
      // icons sit at canonical_y unless an icon above forced them lower.
      CARDS.forEach(c => { tabs[c].style.marginTop = ''; });
      void contentCol.offsetHeight;          // force layout before measuring

      let prevBottom = 0;
      CARDS.forEach((c, i) => {
        const canonical = i * TAB_H;
        const pTop = open[c] ? panels[c].offsetTop : -Infinity;
        const desired = Math.max(canonical, pTop, prevBottom);
        tabs[c].style.marginTop = (desired - prevBottom) + 'px';
        prevBottom = desired + TAB_H;
      });

      // Round icon-col's bottom-right when col2 ends above col1's bottom.
      // Recompute AFTER margins so the comparison sees the final heights.
      if (anyOpen) {
        iconCol.classList.toggle(
          'col2-short',
          contentCol.offsetHeight < iconCol.offsetHeight
        );
      } else {
        iconCol.classList.remove('col2-short');
      }
    }

    // Click is a pure toggle: closed → open, open → closed.
    CARDS.forEach(c => {
      tabs[c].addEventListener('click', () => {
        open[c] = !open[c];
        render();
      });
    });

    render();
  </script>
</body>
</html>
