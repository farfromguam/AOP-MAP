<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Peek V2 — soft wall</title>
<style>
  :root{
    --brown-ink:#2e2418; --brown-mid:#4e4128; --brown-dark:#2a1f12; --brown-soft:#5a4828;
    --rust:#a85020; --paper:#e9e0cb; --paper-band:#e3d7bb; --rule:#3a2c1a;
    --m:92px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0; height:100%; overflow:hidden; background:#cdbf9f;
    font-family:Inter,system-ui,sans-serif; color:var(--brown-ink);}
  .viewport{position:fixed; inset:0; overflow:hidden; touch-action:none; cursor:grab; background:var(--paper-band);}
  .viewport.drag{cursor:grabbing;}
  .stage{position:absolute; top:0; left:0; will-change:transform;}
  .stage.snap{transition:transform 0.4s cubic-bezier(.25,.9,.3,1);}
  .frame{position:absolute; inset:0; background:var(--paper-band);}
  .data{position:absolute; top:var(--m); left:var(--m); width:1200px; height:895px;
    box-shadow:0 0 0 1px rgba(58,44,26,0.18);}
  .keyline{position:absolute; inset:calc(var(--m) - 9px); border:1.5px solid var(--rule);
    box-shadow:0 0 0 5px var(--paper-band);}
  .band{position:absolute; display:flex; align-items:center; justify-content:center;
    font:800 12px Inter,system-ui,sans-serif; letter-spacing:0.42em; text-transform:uppercase;
    color:var(--brown-dark); white-space:nowrap; overflow:hidden;}
  .band.sub{font-weight:700; font-size:10px; letter-spacing:0.3em; color:var(--brown-soft);}
  .band.top{top:0; left:var(--m); right:var(--m); height:var(--m);}
  .band.bottom{bottom:0; left:var(--m); right:var(--m); height:var(--m);}
  .band.left{left:0; top:var(--m); bottom:var(--m); width:var(--m); writing-mode:vertical-rl; transform:rotate(180deg);}
  .band.right{right:0; top:var(--m); bottom:var(--m); width:var(--m); writing-mode:vertical-rl;}
  .dot{position:absolute; width:8px; height:8px; background:var(--rust); transform:rotate(45deg); box-shadow:0 0 0 1px var(--rule);}
  .dot.tl{top:calc(var(--m)/2 - 4px); left:calc(var(--m)/2 - 4px);}
  .dot.tr{top:calc(var(--m)/2 - 4px); right:calc(var(--m)/2 - 4px);}
  .dot.bl{bottom:calc(var(--m)/2 - 4px); left:calc(var(--m)/2 - 4px);}
  .dot.br{bottom:calc(var(--m)/2 - 4px); right:calc(var(--m)/2 - 4px);}
  .hint{position:fixed; left:50%; bottom:16px; transform:translateX(-50%); z-index:9;
    background:rgba(42,31,18,0.82); color:#f3e9d2; padding:7px 14px; border-radius:999px;
    font:700 12px Inter,system-ui,sans-serif; pointer-events:none; transition:opacity .4s ease;}
</style>
</head>
<body>
  <div class="viewport" id="vp">
    <div class="stage" id="stage">
      <div class="frame">
        <div class="band top">Adventure&nbsp;Off&nbsp;Road&nbsp;Park</div>
        <div class="band bottom sub">South&nbsp;Pittsburg&nbsp;·&nbsp;Marion&nbsp;County&nbsp;·&nbsp;Tennessee&nbsp;&nbsp;—&nbsp;&nbsp;MMXXVI</div>
        <div class="band left sub">35°&nbsp;00′&nbsp;North&nbsp;·&nbsp;Cumberland&nbsp;Plateau</div>
        <div class="band right sub">85°&nbsp;36′&nbsp;West&nbsp;·&nbsp;Trail&nbsp;Blazing&nbsp;Invitational</div>
        <span class="dot tl"></span><span class="dot tr"></span>
        <span class="dot bl"></span><span class="dot br"></span>
        <div class="keyline"></div>
      </div>
      <img class="data" src="img/map_sample.png" alt="AOP map" draggable="false">
    </div>
    <div class="hint" id="hint">drag to pan · push to the edge to find the frame</div>
  </div>
<script>
(function(){
  var M=92, DW=1200, DH=895, SW=DW+2*M, SH=DH+2*M;
  var vp=document.getElementById('vp'), stage=document.getElementById('stage'), hint=document.getElementById('hint');
  stage.style.width=SW+'px'; stage.style.height=SH+'px';
  var tx=0, ty=0, dragging=false, sx=0, sy=0, bx=0, by=0;

  // pan limit = the STAGE edge, so the border is a valid place to rest on (a backstop you can lean into)
  function limits(){
    var vw=vp.clientWidth, vh=vp.clientHeight;
    return { txMax:0, txMin:vw-SW, tyMax:0, tyMin:vh-SH };
  }
  function damp(over){ return Math.min(26,Math.abs(over)*0.4)*Math.sign(over); } // tiny give past the frame
  function soft(v,min,max){ if(min>max) return (min+max)/2;
    if(v>max) return max+damp(v-max); if(v<min) return min+damp(v-min); return v; }
  function hard(v,min,max){ if(min>max) return (min+max)/2; return Math.max(min,Math.min(max,v)); }
  function apply(){ stage.style.transform='translate('+tx+'px,'+ty+'px)'; }
  // open centered on the DATA, border off-screen — same first impression as today
  function center(){ var vw=vp.clientWidth, vh=vp.clientHeight; tx=(vw-SW)/2; ty=(vh-SH)/2; apply(); }

  vp.addEventListener('pointerdown',function(e){
    dragging=true; stage.classList.remove('snap'); vp.classList.add('drag');
    sx=e.clientX; sy=e.clientY; bx=tx; by=ty; vp.setPointerCapture(e.pointerId);
    if(hint) hint.style.opacity='0';
  });
  vp.addEventListener('pointermove',function(e){
    if(!dragging) return; var L=limits();
    tx=soft(bx+(e.clientX-sx),L.txMin,L.txMax); ty=soft(by+(e.clientY-sy),L.tyMin,L.tyMax); apply();
  });
  function release(){
    if(!dragging) return; dragging=false; vp.classList.remove('drag');
    var L=limits(); stage.classList.add('snap');   // only the tiny give settles; the frame itself stays
    tx=hard(tx,L.txMin,L.txMax); ty=hard(ty,L.tyMin,L.tyMax); apply();
  }
  vp.addEventListener('pointerup',release);
  vp.addEventListener('pointercancel',release);
  window.addEventListener('resize',center);
  center();
})();
</script>
</body>
</html>
