<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bottom bar — V6 edit pill + merged credit chip</title>
<style>
  :root{
    --brown-ink:#2e2418; --brown-mid:#4e4128; --brown-dark:#2a1f12; --brown-soft:#5a4828;
    --cream-hover:#efe2c6; --cream-surface:rgba(250,246,235,0.96); --cream-border:#d8cdb4;
    --control-bg:#fffdf5; --control-border:#b9aa88;
    --moss:#5f7157; --moss-dark:#384833; --moss-soft:#e3ebdc; --rust:#a85020;
    --hairline:rgba(46,36,24,0.14); --panel-bg:rgba(255,255,255,0.94);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{ font:15px/1.4 Inter,system-ui,sans-serif; color:var(--brown-ink);
    background:#cfc6ac; display:grid; place-items:center; min-height:100vh; padding:20px;}
  .phone{ position:relative; width:390px; height:620px; border-radius:34px; overflow:hidden;
    box-shadow:0 18px 50px rgba(0,0,0,0.28), 0 0 0 9px #1c160e, 0 0 0 10px #2e2418;
    background:#9aa07e;
    background-image:
      radial-gradient(120% 120% at 20% 10%, #a9ad8a 0%, #8f9573 55%, #7e845f 100%),
      repeating-linear-gradient(58deg, rgba(60,70,45,0.10) 0 1px, transparent 1px 26px),
      repeating-linear-gradient(122deg, rgba(60,70,45,0.08) 0 1px, transparent 1px 34px);}
  .railhint{ position:absolute; left:12px; top:14px; width:150px; height:120px; border-radius:10px;
    background:var(--cream-surface); border:1px solid var(--cream-border); opacity:0.45;}
  .home-ind{ position:absolute; left:50%; bottom:7px; transform:translateX(-50%); width:120px; height:4px;
    border-radius:3px; background:rgba(0,0,0,0.30); z-index:6;}

  /* === V6: a single labelled "Edit" pill in the cream palette is the only edit
     control on the bar. Status + attribution merge into ONE cream chip on the
     left: a green dot, the publish count, and the ⓘ that expands to the full
     source list. Two small twins on one row, both in the panel's own cream
     chrome (not a dark overlay). === */
  .edit-pill{ position:absolute; right:10px; bottom:46px; z-index:5;
    display:inline-flex; align-items:center; gap:7px; cursor:pointer;
    height:38px; padding:0 14px 0 12px; border-radius:10px;
    border:1px solid var(--control-border); background:var(--panel-bg); color:var(--brown-ink);
    font-size:0.92rem; font-weight:800;
    box-shadow:0 10px 28px rgba(0,0,0,0.20);}
  .edit-pill svg{ width:17px; height:17px; color:var(--rust); flex:0 0 auto;}
  .edit-pill:hover{ background:var(--cream-hover);}

  .info-chip{ position:absolute; left:10px; bottom:48px; z-index:4;
    display:inline-flex; align-items:center; gap:8px; cursor:pointer;
    height:34px; padding:0 6px 0 11px; border-radius:9px;
    border:1px solid var(--cream-border); background:var(--panel-bg); color:var(--brown-mid);
    font-size:0.8rem; box-shadow:0 8px 22px rgba(0,0,0,0.16);}
  .info-chip .dot{ width:8px; height:8px; border-radius:50%; background:var(--moss); flex:0 0 auto;
    box-shadow:0 0 0 2px rgba(95,113,87,0.22);}
  .info-chip b{ color:var(--brown-dark); font-weight:800;}
  .info-chip .ibtn{ display:inline-grid; place-items:center; width:24px; height:24px;
    border-radius:6px; color:var(--brown-soft);}
  .info-chip .ibtn svg{ width:15px; height:15px;}
  .info-chip:hover{ background:var(--cream-hover); color:var(--brown-dark);}

  /* popped credit sheet (the full attribution the chip's ⓘ reveals) */
  .credits{ position:absolute; left:10px; right:10px; bottom:96px; z-index:7;
    background:var(--control-bg); border:1px solid var(--cream-border); border-radius:11px;
    box-shadow:0 14px 40px rgba(0,0,0,0.28); padding:11px 13px;}
  .credits h3{ margin:0 0 7px; font-size:0.74rem; text-transform:uppercase; letter-spacing:0.05em;
    color:var(--brown-dark);}
  .credits ul{ margin:0; padding:0; list-style:none; display:grid; gap:3px;
    font-size:0.76rem; color:var(--brown-soft); line-height:1.4;}
  .credits li b{ color:var(--brown-dark); font-weight:700;}

  .caption{ position:absolute; left:8px; right:8px; bottom:96px;
    background:rgba(46,36,24,0.82); color:#f3ecdc; font-size:0.76rem; line-height:1.45;
    padding:9px 12px; border-radius:8px; z-index:5;}
  .caption b{ color:#fff; }
</style>
</head>
<body>
  <div class="phone">
    <div class="railhint"></div>

    <div class="caption"><b>V6 · Edit pill + merged credit chip.</b> One cream "Edit"
      pill opens the panel. Status and attribution live in a single cream chip — green
      dot + count + an <b>ⓘ</b> that expands the full source list. Both in the panel's
      own chrome, not a dark overlay.</div>

    <!-- the single button -->
    <button class="edit-pill" title="Open edit panel">
      <svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.7"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M14.5 3.5l4 4L8 18l-4.5 1L4.5 14.5 14.5 3.5z"/>
      </svg>
      Edit
    </button>

    <!-- info + attribution, one merged chip -->
    <div class="info-chip" title="Publish status &amp; map sources">
      <span class="dot"></span><span><b>5</b> published</span>
      <span class="ibtn" title="Map sources &amp; credits">
        <svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
          <circle cx="11" cy="11" r="8.2"/><path d="M11 10v5" stroke-linecap="round"/><circle cx="11" cy="6.7" r="0.5" fill="currentColor" stroke-width="1.4"/>
        </svg>
      </span>
    </div>

    <div class="home-ind"></div>
  </div>
</body>
</html>
