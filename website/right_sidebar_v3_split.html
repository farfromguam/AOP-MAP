<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Right sidebar V3 — fixed split</title>
  <!--
    Built on the CURRENT reworked sidebar. ONE global tabbed edit panel that is
    ALWAYS present in a fixed lower split (~55%); the tree lives in the upper
    split (~45%). Tabs are SEGMENTED PILLS. When nothing is selected the editor
    shows a quiet "Select a feature to edit" placeholder rather than vanishing —
    so the edit region never shifts the layout. Both halves scroll independently.

    WIDTH-WHEN-SCROLLING FIX: each scroll region uses `scrollbar-gutter: stable`,
    and the split divider/editor are full-width flex children (not narrowed by
    the tree's scrollbar). Long labels ellipsis.
  -->
  <style>
    :root{
      --paper:#e9e0cc; --panel-bg:#f7f2e6; --ink:#2b2620; --line:#d8cdb4; --rust:#b4561f;
      --muted:#8a7d63; --faint:#b3a484; --sub:#4a4438; --label:#6e6450;
      --soft:rgba(180,86,31,.08); --soft2:rgba(180,86,31,.12);
    }
    *{box-sizing:border-box;}
    html,body{margin:0;height:100%;font:14px/1.45 -apple-system,Segoe UI,Roboto,Inter,sans-serif;color:var(--ink);}
    body{overflow:hidden;}
    #map{position:fixed;inset:0;background:
      radial-gradient(circle at 28% 26%,#cdd7b8,transparent 58%),
      radial-gradient(circle at 72% 68%,#bcc6a2,transparent 55%),
      linear-gradient(135deg,#a6b187,#8b9770);}
    #map::after{content:"";position:absolute;inset:0;background-image:
      linear-gradient(rgba(255,255,255,.06) 1px,transparent 1px),
      linear-gradient(90deg,rgba(255,255,255,.06) 1px,transparent 1px);background-size:64px 64px;}

    .panel{position:fixed;top:0;right:0;bottom:0;width:340px;max-width:92vw;
      background:var(--panel-bg);border-left:1px solid var(--line);
      box-shadow:-2px 0 12px rgba(0,0,0,.10);display:flex;flex-direction:column;overflow:hidden;}
    .panel-head{flex:none;display:flex;align-items:center;gap:8px;padding:12px 14px 8px;border-bottom:1px solid var(--line);}
    .panel-head h1{margin:0;font-size:14px;font-weight:600;flex:1;letter-spacing:.2px;}
    .panel-head .preset{font-size:11px;color:var(--muted);}

    /* upper split: the tree. Fixed proportion so the editor never shifts it. */
    .panel-body{flex:0 0 44%;min-height:0;overflow-y:auto;scrollbar-gutter:stable;padding:12px 12px 14px;}

    .panel-section{margin-bottom:14px;}
    .section-header{display:flex;align-items:center;justify-content:space-between;width:100%;gap:8px;cursor:pointer;background:none;border:0;padding:0 0 4px;margin-bottom:6px;border-bottom:1px solid var(--line);text-align:left;color:inherit;font:inherit;}
    .section-label{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:700;}
    .section-chevron{color:var(--faint);font-size:12px;line-height:1;transform:rotate(90deg);transition:transform .12s;}
    .panel-section.collapsed .section-chevron{transform:rotate(0);}
    .section-body{display:flex;flex-direction:column;}
    .panel-section.collapsed .section-body{display:none;}

    .node-group{display:flex;flex-direction:column;}
    .node{display:flex;align-items:center;gap:6px;border-radius:6px;}
    .node-chevron-btn{background:none;border:0;padding:6px 2px;cursor:pointer;display:flex;align-items:center;}
    .node-chevron{color:var(--faint);font-size:11px;line-height:1;transform:rotate(0);transition:transform .12s;}
    .node-group.expanded>.node .node-chevron{transform:rotate(90deg);}
    .node-select{flex:1;min-width:0;display:flex;align-items:center;gap:8px;background:none;border:0;padding:7px 4px;cursor:pointer;font:inherit;color:inherit;text-align:left;border-radius:6px;}
    .node-select:hover{background:var(--soft);}
    .node-group.selected>.node>.node-select{background:var(--soft2);font-weight:600;}
    .node-label{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .node-count{color:var(--faint);font-size:12px;font-variant-numeric:tabular-nums;flex:none;}
    .node-create{background:none;border:1px solid var(--line);color:var(--rust);width:24px;height:24px;border-radius:6px;cursor:pointer;font-size:18px;line-height:1;padding:0;flex:none;display:flex;align-items:center;justify-content:center;}
    .lock-btn{flex:none;background:none;border:0;padding:2px 5px;cursor:pointer;color:var(--faint);display:flex;align-items:center;border-radius:5px;font-size:13px;}
    .lock-btn.locked{color:var(--rust);}
    .node-content{margin-left:14px;border-left:1px solid var(--line);padding-left:4px;display:none;}
    .node-group.expanded>.node-content{display:block;}
    .node-items{margin:2px 0 6px;}
    .item{display:flex;align-items:center;}
    .item-select{flex:1;min-width:0;text-align:left;background:none;border:0;padding:5px 10px;font:inherit;font-size:13px;color:var(--sub);cursor:pointer;border-radius:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .item.selected>.item-select{background:var(--soft2);font-weight:600;}

    /* ============ V3: FIXED SPLIT — persistent editor, segmented tabs ============ */
    .editor{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;border-top:2px solid var(--rust);
      background:linear-gradient(180deg,#fbf4df,#f7efd6);overflow:hidden;}
    .ed-head{flex:none;display:grid;grid-template-columns:auto 1fr auto auto;gap:8px;align-items:center;padding:8px 12px 6px;}
    .ed-pill{background:#fff;border:1px solid var(--line);border-radius:999px;padding:1px 8px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--sub);white-space:nowrap;}
    .ed-title{font-weight:700;color:var(--ink);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .ed-icon,.ed-close{background:#fff;border:1px solid var(--line);border-radius:6px;width:26px;height:26px;cursor:pointer;color:var(--sub);font-size:13px;}
    .ed-close{background:none;border:0;}
    .ed-tabs{display:flex;gap:5px;flex:none;padding:2px 10px 8px;}
    .ed-tabs button{flex:1;background:#fff;border:1px solid var(--line);border-radius:7px;padding:6px 4px;font:inherit;font-size:11px;font-weight:700;color:var(--muted);cursor:pointer;text-transform:uppercase;letter-spacing:.03em;}
    .ed-tabs button.on{background:var(--rust);color:#fff;border-color:var(--rust);}
    .ed-body{flex:1 1 auto;min-height:0;overflow-y:auto;scrollbar-gutter:stable;padding:4px 12px 12px;}
    .ed-pane{display:none;}.ed-pane.on{display:block;}
    .ed-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--faint);text-align:center;padding:20px;}
    .ed-empty .big{font-size:26px;}

    .fld{display:flex;align-items:center;gap:8px;font-size:13px;margin-bottom:8px;}
    .fld .k{flex:none;width:84px;color:var(--label);font-size:11px;text-transform:uppercase;letter-spacing:.04em;}
    .fld .v{color:var(--sub);word-break:break-word;}
    .fld.col{flex-direction:column;align-items:stretch;gap:4px;}
    .fld.col .k{width:auto;}
    .fld input[type=text],.fld select,.fld textarea{flex:1;min-width:0;padding:6px 8px;font:inherit;font-size:13px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink);}
    .fld textarea{resize:vertical;}
    .fld input[type=range]{flex:1;accent-color:var(--rust);}
    .fld input[type=color]{width:40px;height:26px;border:1px solid var(--line);border-radius:6px;background:#fff;padding:2px;}
    .grp{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:700;margin:4px 0 8px;}
    .acts{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;}
    .act{background:#fff;border:1px solid var(--line);color:var(--ink);padding:6px 10px;border-radius:6px;cursor:pointer;font:inherit;font-size:12px;}
    .act.danger{color:#a3331a;border-color:#e3b3a6;}
    .toggle-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-size:13px;color:var(--sub);}
    .tg{width:30px;height:26px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--faint);cursor:pointer;font-size:14px;}
    .tg.on{background:var(--rust);color:#fff;border-color:var(--rust);}
  </style>
</head>
<body>
  <div id="map"></div>
  <aside class="panel">
    <div class="panel-head"><h1>AOP edit panel</h1><span class="preset">Park preset</span></div>

    <!-- upper split: tree -->
    <div class="panel-body">
      <div class="panel-section collapsed"><button class="section-header"><span class="section-label">Source layers</span><span class="section-chevron">›</span></button><div class="section-body"></div></div>
      <div class="panel-section collapsed"><button class="section-header"><span class="section-label">Derived layers</span><span class="section-chevron">›</span></button><div class="section-body"></div></div>
      <div class="panel-section">
        <button class="section-header"><span class="section-label">Map editor</span><span class="section-chevron">›</span></button>
        <div class="section-body">
          <div class="node-group expanded selected">
            <div class="node"><button class="node-chevron-btn"><span class="node-chevron">▸</span></button><button class="node-select"><span class="node-label">Drawn POIs</span><span class="node-count">5</span></button><button class="node-create">+</button><button class="lock-btn">🔓</button></div>
            <div class="node-content"><div class="node-items">
              <div class="item selected"><button class="item-select">Pavilion</button><button class="lock-btn">🔓</button></div>
              <div class="item"><button class="item-select">Registration</button><button class="lock-btn">🔓</button></div>
              <div class="item"><button class="item-select">Coffee</button><button class="lock-btn">🔓</button></div>
            </div></div>
          </div>
          <div class="node-group"><div class="node"><button class="node-chevron-btn"><span class="node-chevron">▸</span></button><button class="node-select"><span class="node-label">Visitor context callouts</span><span class="node-count">2</span></button><button class="node-create">+</button><button class="lock-btn locked">🔒</button></div></div>
          <div class="node-group"><div class="node"><button class="node-chevron-btn"><span class="node-chevron">▸</span></button><button class="node-select"><span class="node-label">Brand logos (AOP &amp; Rock Warblers)</span><span class="node-count">2</span></button><button class="node-create">+</button><button class="lock-btn">🔓</button></div></div>
        </div>
      </div>
    </div>

    <!-- lower split: the ONE global edit panel, always present (placeholder when idle) -->
    <div class="editor">
      <div class="ed-head">
        <span class="ed-pill">Point</span>
        <span class="ed-title">Pavilion</span>
        <button class="ed-icon" title="Fly to">🎯</button>
        <button class="ed-close" title="Clear selection">✕</button>
      </div>
      <div class="ed-tabs">
        <button class="on" data-tab="identify">Identify</button>
        <button data-tab="edit">Edit</button>
        <button data-tab="display">Display</button>
        <button data-tab="source">Source</button>
      </div>
      <div class="ed-body">
        <div class="ed-pane on" data-pane="identify">
          <label class="fld"><span class="k">Name</span><input type="text" value="Pavilion" /></label>
          <label class="fld col"><span class="k">Description</span><textarea rows="2">Open-sided structure; main gathering point on event day.</textarea></label>
          <div class="fld"><span class="k">Kind</span><span class="v">poi</span></div>
          <label class="fld"><span class="k">Category</span><select><option>Pavilion</option><option>Building</option><option>Restroom</option><option>Hazard</option></select></label>
          <label class="fld"><span class="k">Tag</span><input type="text" value="#pavilion" /></label>
          <label class="fld"><span class="k">Group</span><select><option>Drawn POIs</option><option>Trailheads</option><option>Brand logos</option></select></label>
        </div>
        <div class="ed-pane" data-pane="edit">
          <div class="grp">This feature</div>
          <div class="acts"><button class="act">✋ Move</button><button class="act">⧉ Duplicate</button><button class="act">⧉ Copy GeoJSON</button><button class="act">🔓 Lock</button><button class="act danger">🗑 Delete</button></div>
          <div class="grp">Layer paint · Drawn POIs</div>
          <label class="fld"><span class="k">Opacity</span><input type="range" min="0" max="100" value="95" /></label>
          <label class="fld"><span class="k">Color</span><input type="color" value="#b4561f" /></label>
          <label class="fld"><span class="k">Radius</span><input type="range" min="2" max="14" value="7" /></label>
        </div>
        <div class="ed-pane" data-pane="display">
          <div class="toggle-row"><button class="tg on">👁</button><span>Visible on map</span></div>
          <div class="toggle-row"><button class="tg on">★</button><span>Surface to visitors (★)</span></div>
          <label class="fld"><span class="k">Label size</span><input type="range" min="8" max="20" value="12" /></label>
        </div>
        <div class="ed-pane" data-pane="source">
          <div class="fld"><span class="k">Origin</span><span class="v">Drawn POI · seeded</span></div>
          <div class="fld"><span class="k">Coords</span><span class="v">35.0419, −85.6928</span></div>
          <div class="fld"><span class="k">Confidence</span><span class="v">observed</span></div>
          <div class="fld"><span class="k">Permission</span><span class="v">park</span></div>
          <div class="fld"><span class="k">Status</span><span class="v">active</span></div>
          <div class="fld"><span class="k">Last checked</span><span class="v">2026-05-26</span></div>
        </div>
      </div>
    </div>
  </aside>

  <script>
    document.addEventListener('click',function(e){
      var t=e.target.closest('[data-tab]');
      if(t){var ed=t.closest('.editor');ed.querySelectorAll('.ed-tabs button').forEach(function(b){b.classList.toggle('on',b===t);});ed.querySelectorAll('.ed-pane').forEach(function(p){p.classList.toggle('on',p.dataset.pane===t.dataset.tab);});return;}
      var sh=e.target.closest('.section-header');if(sh){sh.parentElement.classList.toggle('collapsed');return;}
      var nc=e.target.closest('.node-chevron-btn');if(nc){nc.closest('.node-group').classList.toggle('expanded');return;}
    });
  </script>
</body>
</html>
