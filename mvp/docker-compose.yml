version: '3.9'
services:
  db:
    image: postgis/postgis:15-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: aop
      POSTGRES_PASSWORD: aop
      POSTGRES_DB: aop_map
    volumes:
      - ./db-data:/var/lib/postgresql/data
      # initdb.d runs *.sql in sorted order on a fresh volume:
      # init_db.sql (schema) sorts before the seed_* fixtures, so a fresh dev DB
      # comes up with the destination POI rows + the published park_boundaries seeded.
      - ./init_db.sql:/docker-entrypoint-initdb.d/init_db.sql:ro
      - ./scripts/seed_core_pois.sql:/docker-entrypoint-initdb.d/seed_core_pois.sql:ro
      - ./scripts/seed_core_park_boundaries.sql:/docker-entrypoint-initdb.d/seed_core_park_boundaries.sql:ro
    ports:
      - "${AOP_DB_HOST_PORT:-55432}:5432"
