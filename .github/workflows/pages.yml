# Publishes the static MapLibre viewer (website/) to GitHub Pages.
# The whole site is flat files — no build step — so we just upload website/
# as the Pages root. App ends up at https://farfromguam.github.io/AOP-MAP/
name: Deploy viewer to Pages

on:
  push:
    branches: [master]
    paths:
      - 'website/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch: {}

# Allow the workflow to publish Pages, and serialize concurrent deploys.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website
      - id: deployment
        uses: actions/deploy-pages@v4
